let cityMarkerEls = [];
let cityMarker3Ds = [];
function createCityMarkers(){
  const container = document.getElementById('htmlMarkers');
  container.innerHTML = '';
  cityMarkerEls = [];
  cityMarker3Ds = [];
  liveNations.forEach(nation => {
    nation.cities.forEach((city, ci) => {
      if(city.pop <= 0) return;
      const isPlayer = nation.id === playerNation.id;
      const color = isPlayer ? '#58a6ff' : '#f85149';
      const sz = isPlayer ? 10 : 12;
      const isTouch = matchMedia('(pointer:coarse)').matches;
      const hitArea = isTouch ? 56 : 40; // larger on touch devices
      const isTargeted = targetQueue.some(function(tq){ return tq.nationId===nation.id && tq.cityIdx===ci; });
      const el = document.createElement('div');
      el.className = 'html-marker';
      el.style.width = hitArea+'px'; el.style.height = hitArea+'px';
      el.style.cursor = isPlayer ? 'default' : 'crosshair';
      el.style.zIndex = isPlayer ? '30' : '35';
      // Visible dot + pulsing ring for enemies + targeted indicator
      var markerHTML = '<div class="html-marker-core" style="width:'+sz+'px;height:'+sz+'px;background:'+color+';box-shadow:0 0 10px '+color+',0 0 20px '+color+'44"></div>';
      if(!isPlayer){
        // Outer pulsing ring to make clickable cities obvious
        markerHTML += '<div style="position:absolute;width:'+(sz*2.5)+'px;height:'+(sz*2.5)+'px;border:1.5px solid '+color+'88;border-radius:50%;animation:pulse-dot 2s ease-in-out infinite;top:50%;left:50%;transform:translate(-50%,-50%)"></div>';
      }
      if(isTargeted){
        // Crosshair overlay for targeted cities
        markerHTML += '<div style="position:absolute;width:'+(sz*3)+'px;height:'+(sz*3)+'px;border:2px solid #ff0;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 8px #ff0"></div>';
        markerHTML += '<div style="position:absolute;font-family:JetBrains Mono,monospace;font-size:8px;color:#ff0;top:-14px;left:50%;transform:translateX(-50%);white-space:nowrap;text-shadow:0 0 4px #000,0 0 8px #000">☢ TARGET</div>';
      }
      // Saturation badge — show ×N when multiple warheads stacked on same city
      var stackCount = targetQueue.filter(function(tq){ return tq.nationId===nation.id && tq.cityIdx===ci; }).length;
      if(stackCount > 1){
        markerHTML += '<div style="position:absolute;font-family:JetBrains Mono,monospace;font-size:9px;font-weight:700;color:#ff0;top:-28px;left:50%;transform:translateX(-50%);white-space:nowrap;text-shadow:0 0 4px #000,0 0 8px #000;background:rgba(0,0,0,0.65);padding:1px 5px;border-radius:3px;border:1px solid #ff0">×'+stackCount+'</div>';
      }
      // City name label
      markerHTML += '<div style="position:absolute;font-family:JetBrains Mono,monospace;font-size:7px;letter-spacing:0.5px;color:'+(isPlayer?'#58a6ff99':'#f8514999')+';bottom:-12px;left:50%;transform:translateX(-50%);white-space:nowrap;text-shadow:0 0 4px #000,0 0 8px #000;pointer-events:none">'+city.name+'</div>';
      el.innerHTML = markerHTML;
      el.title = city.name + ' (' + nation.name + ') — Pop: ' + formatNum(city.pop) + (isPlayer ? '' : ' · Shift-click to saturate');
      if(!isPlayer) el.onclick = function(e){ e.stopPropagation(); addTarget(nation.id, ci, e.shiftKey || e.ctrlKey || e.metaKey); };
      container.appendChild(el);
      cityMarkerEls.push({el, lat:city.lat, lng:city.lng, nationId:nation.id, cityIdx:ci});
      cityMarker3Ds.push(latLngToVec3(city.lat, city.lng, globeRadius * 1.001));
    });
  });
}

function updateCityMarkerPositions(){
  var W = renderer.domElement.clientWidth;
  var H = renderer.domElement.clientHeight;
  var hw = W / 2;
  var hh = H / 2;
  cityMarkerEls.forEach(function(m, i){
    var pos = _tempPos.copy(cityMarker3Ds[i]).applyMatrix4(globeGroup.matrixWorld);
    // Visibility: check if marker is on the visible side of the globe
    _tempViewDir.subVectors(camera.position, pos).normalize();
    _tempNormal.copy(pos).normalize();
    var isVisible = _tempNormal.dot(_tempViewDir) > 0.1;
    if(isVisible){
      pos.project(camera);
      var x = (pos.x * hw) + hw;
      var y = -(pos.y * hh) + hh;
      m.el.style.left = x + 'px';
      m.el.style.top = y + 'px';
      m.el.classList.remove('hidden');
    } else {
      m.el.classList.add('hidden');
    }
  });
}

function addTarget(nationId, cityIdx, multi){
  if(gamePhase !== 'PLAYING') return;
  if(playerNation.warheads <= targetQueue.length){
    addLog('⚠ No warheads remaining!');
    showToast('No warheads remaining!', 't-warn');
    return;
  }
  var nation = liveNations.find(function(n){ return n.id===nationId; });
  var city = nation.cities[cityIdx];
  if(city.pop <= 0){ addLog('City already destroyed.'); return; }
  var existingCount = targetQueue.filter(function(t){ return t.nationId===nationId && t.cityIdx===cityIdx; }).length;
  // Plain click toggles, shift/ctrl/cmd-click stacks (saturation)
  if(existingCount > 0 && !multi){ removeTarget(nationId, cityIdx); return; }
  targetQueue.push({nationId:nationId, cityIdx:cityIdx});
  if(multi && existingCount > 0){
    addLog('🎯 Saturating ' + city.name + ' ×' + (existingCount + 1));
  } else {
    addLog('🎯 Targeting ' + city.name + ', ' + nation.name);
  }
  sfxClick();
  renderTargetQueue();
  renderGlobalStats();
  updateMobileBar();
  createCityMarkers();
}

function removeTarget(nationId, cityIdx){
  // Remove only one matching entry (so click on ×3 stack drops to ×2)
  var removed = false;
  targetQueue = targetQueue.filter(function(t){
    if(!removed && t.nationId===nationId && t.cityIdx===cityIdx){ removed = true; return false; }
    return true;
  });
  renderTargetQueue();
  renderGlobalStats();
  updateMobileBar();
  createCityMarkers();
}

function renderTargetQueue(){
  var el = document.getElementById('targetList');
  if(targetQueue.length === 0){
    el.innerHTML = '<div style="color:var(--text3);font-size:11px;padding:8px;font-style:italic">Click enemy cities on the globe to target them. <span style="color:var(--accent2)">Shift-click</span> stacks warheads to overwhelm defenses.</div>';
    document.getElementById('launchBtn').style.display = 'none';
    return;
  }
  // Group queue by city
  var groups = [];
  targetQueue.forEach(function(t){
    var existing = groups.find(function(g){ return g.nationId===t.nationId && g.cityIdx===t.cityIdx; });
    if(existing) existing.count++;
    else groups.push({nationId:t.nationId, cityIdx:t.cityIdx, count:1});
  });
  el.innerHTML = groups.map(function(g){
    var nation = liveNations.find(function(n){ return n.id===g.nationId; });
    var city = nation.cities[g.cityIdx];
    var stackBadge = g.count > 1 ? '<span style="color:#ff0;font-family:JetBrains Mono,monospace;font-size:9px;font-weight:700;margin-left:6px;background:rgba(255,255,0,0.12);padding:1px 5px;border-radius:3px;border:1px solid rgba(255,255,0,0.5)">×'+g.count+'</span>' : '';
    return '<div class="ct-conflict-link" onclick="removeTarget(\''+g.nationId+'\','+g.cityIdx+')" style="margin-bottom:4px"><div class="ct-conflict-dot" style="background:var(--red)"></div><div class="ct-conflict-name">'+nation.flag+' '+city.name+stackBadge+'</div><div class="ct-conflict-sev" style="color:var(--text3)">✕</div></div>';
  }).join('');
  document.getElementById('launchBtn').style.display = 'block';
}

function confirmLaunch(){
  if(gamePhase !== 'PLAYING' || targetQueue.length === 0) return;
  var count = targetQueue.length;
  var overlay = document.getElementById('confirmOverlay');
  overlay.innerHTML = '<div class="confirm-overlay" onclick="this.parentElement.innerHTML=\'\'"><div class="confirm-dialog" onclick="event.stopPropagation()"><div class="confirm-icon">\u2622</div><div class="confirm-title">Confirm Launch</div><div class="confirm-sub">Launch ' + count + ' warhead' + (count>1?'s':'') + '? This cannot be undone.</div><div class="confirm-actions"><button class="confirm-btn cancel" onclick="document.getElementById(\'confirmOverlay\').innerHTML=\'\';">Abort</button><button class="confirm-btn danger" onclick="document.getElementById(\'confirmOverlay\').innerHTML=\'\';launchMissiles();">Launch</button></div></div></div>';
}

function launchMissiles(){
  if(gamePhase !== 'PLAYING' || targetQueue.length === 0) return;
  gamePhase = 'LAUNCHING';
  document.getElementById('gamePhaseHeader').innerHTML = '☢ MISSILES INBOUND...';
  document.getElementById('gamePhaseHeader').style.color = 'var(--red)';
  document.getElementById('launchBtn').style.display = 'none';
  setDefcon(2);
  sfxLaunch();
  addLog('🚀 LAUNCHING ' + targetQueue.length + ' WARHEADS!');
  playerNation.warheads -= targetQueue.length;
  updatePlayerHUD();
  updateMobileBar();
  var delay = 0;
  var seenIdx = {};
  targetQueue.forEach(function(t){
    var nation = liveNations.find(function(n){ return n.id===t.nationId; });
    var city = nation.cities[t.cityIdx];
    var fromCity = playerNation.cities.find(function(c){ return c.pop > 0; }) || playerNation.cities[0];
    var key = t.nationId + ':' + t.cityIdx;
    var satIdx = seenIdx[key] || 0;
    seenIdx[key] = satIdx + 1;
    setTimeout(function(){ launchOneMissile(fromCity, city, nation, t.cityIdx, satIdx); }, delay);
    delay += 400;
  });
  var totalDelay = delay;
  setTimeout(function(){
    targetQueue = [];
    renderTargetQueue();
    setTimeout(aiTurn, 2000);
  }, totalDelay + 12000);
}

function launchOneMissile(from, to, targetNation, cityIdx, saturationIdx){
  var startPos = latLngToVec3(from.lat, from.lng, globeRadius * 1.002);
  var endPos = latLngToVec3(to.lat, to.lng, globeRadius * 1.002);
  var mid = startPos.clone().add(endPos).multiplyScalar(0.5).normalize().multiplyScalar(globeRadius * 1.4);
  var curve = new THREE.QuadraticBezierCurve3(startPos, mid, endPos);
  var pts = curve.getPoints(60);
  var geo = new THREE.BufferGeometry().setFromPoints(pts);
  var mat = new THREE.LineBasicMaterial({color:0xff4444, transparent:true, opacity:0.6});
  var line = new THREE.Line(geo, mat);
  globeGroup.add(line);
  var dotGeo = new THREE.SphereGeometry(0.008, 8, 8);
  var dotMat = new THREE.MeshBasicMaterial({color:0xff8844});
  var dot = new THREE.Mesh(dotGeo, dotMat);
  globeGroup.add(dot);

  // Pre-roll intercept; saturationIdx degrades defense per stacked warhead
  var satIdx = saturationIdx || 0;
  var baseIntercept = targetNation.defense * 0.3 + (targetNation.interceptBoost || 0);
  var interceptChance = baseIntercept * Math.pow(0.7, satIdx);
  var defended = Math.random() < interceptChance;
  var interceptT = 0.78 + Math.random() * 0.12;

  missileFlights.push({
    line:line, dot:dot, curve:curve, t:0,
    targetNation:targetNation, cityIdx:cityIdx, to:to, done:false,
    defended: defended, interceptT: interceptT,
    interceptorSpawned: false, interceptor: null
  });
}

function spawnInterceptor(f){
  var cityPos = latLngToVec3(f.to.lat, f.to.lng, globeRadius * 1.002);
  var meetPos = f.curve.getPoint(f.interceptT);
  var iMid = cityPos.clone().add(meetPos).multiplyScalar(0.5).normalize().multiplyScalar(globeRadius * 1.18);
  var iCurve = new THREE.QuadraticBezierCurve3(cityPos, iMid, meetPos);
  var iPts = iCurve.getPoints(30);
  var iGeo = new THREE.BufferGeometry().setFromPoints(iPts);
  var iMat = new THREE.LineBasicMaterial({color:0x66ddff, transparent:true, opacity:0.55});
  var iLine = new THREE.Line(iGeo, iMat);
  globeGroup.add(iLine);
  var iDotGeo = new THREE.SphereGeometry(0.007, 8, 8);
  var iDotMat = new THREE.MeshBasicMaterial({color:0xaaffff});
  var iDot = new THREE.Mesh(iDotGeo, iDotMat);
  globeGroup.add(iDot);
  f.interceptor = {line:iLine, dot:iDot, curve:iCurve, t:0, meetPos:meetPos.clone()};
  sfxIntercept();
}

function spawnInterceptFlash(pos){
  var fGeo = new THREE.SphereGeometry(0.018, 16, 16);
  var fMat = new THREE.MeshBasicMaterial({color:0xeeffff, transparent:true, opacity:1, depthWrite:false, blending:THREE.AdditiveBlending});
  var fm = new THREE.Mesh(fGeo, fMat);
  fm.position.copy(pos);
  globeGroup.add(fm);
  var rGeo = new THREE.RingGeometry(0.01, 0.012, 24);
  var rMat = new THREE.MeshBasicMaterial({color:0x66ddff, transparent:true, opacity:0.9, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending});
  var r = new THREE.Mesh(rGeo, rMat);
  r.position.copy(pos);
  r.lookAt(pos.clone().multiplyScalar(2));
  globeGroup.add(r);
  explosionsV3.push({type:'v3_intercept_flash', mesh:fm, t:0});
  explosionsV3.push({type:'v3_intercept_ring', mesh:r, t:0});
}

function updateMissiles(dt){
  missileFlights.forEach(function(f){
    if(f.done) return;
    f.t += dt * 0.1;

    if(f.defended && !f.interceptorSpawned && f.t >= 0.55){
      f.interceptorSpawned = true;
      spawnInterceptor(f);
    }

    if(f.interceptor){
      f.interceptor.t += dt * 0.18;
      if(f.interceptor.t >= 1){
        var meetPos = f.interceptor.meetPos;
        spawnInterceptFlash(meetPos);
        globeGroup.remove(f.interceptor.dot); globeGroup.remove(f.interceptor.line);
        f.interceptor.dot.geometry.dispose(); f.interceptor.dot.material.dispose();
        f.interceptor.line.geometry.dispose(); f.interceptor.line.material.dispose();
        f.interceptor = null;
        globeGroup.remove(f.dot); globeGroup.remove(f.line);
        f.dot.geometry.dispose(); f.dot.material.dispose();
        f.line.geometry.dispose(); f.line.material.dispose();
        f.done = true;
        addLog('🛡 ' + f.targetNation.flag + ' intercepted strike on ' + f.to.name + '!');
        return;
      } else {
        f.interceptor.dot.position.copy(f.interceptor.curve.getPoint(f.interceptor.t));
      }
    }

    if(f.t >= 1){
      f.t = 1; f.done = true;
      globeGroup.remove(f.dot); globeGroup.remove(f.line);
      f.dot.geometry.dispose(); f.dot.material.dispose();
      f.line.geometry.dispose(); f.line.material.dispose();
      sfxImpact();
      triggerExplosion(f.to.lat, f.to.lng, f.to, f.targetNation, f.cityIdx);
    } else {
      var pt = f.curve.getPoint(f.t);
      f.dot.position.copy(pt);
    }
  });
  missileFlights = missileFlights.filter(function(f){ return !f.done; });
}

function triggerExplosion(lat, lng, city, nation, cityIdx){
  // ── Game logic: damage, kills, HUD ──
  var kills = Math.round(city.pop * (0.4 + Math.random() * 0.4));
  nation.cities[cityIdx].pop = Math.max(0, city.pop - kills);
  nation.casualties = (nation.casualties || 0) + kills;
  totalKills += kills;
  addLog('💥 ' + city.name + ' hit! ' + formatNum(kills) + ' casualties.');

  // ── Use V4 shader-based explosion system ──
  triggerExplosionV4(lat, lng);

  // ── Permanent fiery scorch on the earth's surface at impact ──
  addImpactScorch(lat, lng);

  // ── Check if nation is fully destroyed ──
  checkNationDestroyed(nation);
  // ── Check planet-wide collapse — ends game immediately if crossed ──
  checkApocalypse();

  updatePlayerHUD();
  renderGlobalStats();
  createCityMarkers();
}

function updateExplosions(dt){
  explosions.forEach(function(e){
    e.t += dt;

    // ── LIGHT BEAM: shoots up fast, holds, fades ──
    if(e.type === 'beam'){
      var beamLife = 0.8;
      if(e.t < 0.12){
        var rise = e.t / 0.12;
        e.mesh.scale.set(1, rise, 1);
        e.mesh.material.opacity = 1.0;
      } else {
        var fadeT = (e.t - 0.12) / (beamLife - 0.12);
        e.mesh.material.opacity = Math.max(0, 1.0 - fadeT * fadeT);
        var widen = 1 + fadeT * 3;
        e.mesh.scale.set(widen, 1, widen);
      }
      if(e.t > beamLife){
        globeGroup.remove(e.mesh); e.mesh.geometry.dispose(); e.mesh.material.dispose(); e.done = true;
      }
    }

    if(e.type === 'beam_glow'){
      var life = 0.7;
      var fade = Math.max(0, 1 - e.t / life);
      e.mesh.material.opacity = 0.35 * fade;
      var s = 1 + e.t * 2;
      e.mesh.scale.set(s, 1, s);
      if(e.t > life){
        globeGroup.remove(e.mesh); e.mesh.geometry.dispose(); e.mesh.material.dispose(); e.done = true;
      }
    }

    // ── DETONATION FLASH: rapid expand + vanish ──
    if(e.type === 'detonation'){
      var s = 1 + e.t * 25;
      e.mesh.scale.set(s, s, s);
      e.mesh.material.opacity = Math.max(0, 1 - e.t * 3.5);
      if(e.t > 0.35){
        globeGroup.remove(e.mesh); e.mesh.geometry.dispose(); e.mesh.material.dispose(); e.done = true;
      }
    }

    // ── EXPANSION WAVES: large rings racing outward ──
    if(e.type === 'expansion_wave'){
      var speed = 25 - e.waveIdx * 4;
      var s = 1 + e.t * speed;
      e.mesh.scale.set(s, s, s);
      var life = 1.0 + e.waveIdx * 0.25;
      e.mesh.material.opacity = Math.max(0, (0.85 - e.waveIdx*0.12) * (1 - e.t / life));
      if(e.t > life){
        globeGroup.remove(e.mesh); e.mesh.geometry.dispose(); e.mesh.material.dispose(); e.done = true;
      }
    }

    // ── FIREBALL: grows, rises, color shifts orange→red→dark ──
    if(e.type === 'fireball'){
      var s = 1 + e.t * 4;
      e.mesh.scale.set(s, s, s);
      var riseAmt = Math.min(e.t * 0.06, 0.08);
      e.mesh.position.copy(e.basePos.clone().add(e.normal.clone().multiplyScalar(0.02 + riseAmt)));
      var r = e.t < 0.4 ? 1.0 : Math.max(0.2, 1.0 - (e.t - 0.4) * 1.0);
      var g = Math.max(0, 0.6 - e.t * 0.5);
      e.mesh.material.color.setRGB(r, g, 0);
      e.mesh.material.opacity = Math.max(0, 0.9 - e.t * 0.45);
      if(e.t > 2.0){
        globeGroup.remove(e.mesh); e.mesh.geometry.dispose(); e.mesh.material.dispose(); e.done = true;
      }
    }

    if(e.type === 'fireball_core'){
      var s = 1 + e.t * 3;
      e.mesh.scale.set(s, s, s);
      var riseAmt = Math.min(e.t * 0.06, 0.08);
      e.mesh.position.copy(e.basePos.clone().add(e.normal.clone().multiplyScalar(0.02 + riseAmt)));
      e.mesh.material.opacity = Math.max(0, 0.95 - e.t * 1.2);
      if(e.t > 0.9){
        globeGroup.remove(e.mesh); e.mesh.geometry.dispose(); e.mesh.material.dispose(); e.done = true;
      }
    }

    // ── MUSHROOM STEM: segments rise to form thick column (1 sec rise) ──
    if(e.type === 'mushroom_stem'){
      var riseDuration = 1.0;
      var riseT = Math.min(e.t / riseDuration, 1);
      // Ease-out for smooth rise
      var easedT = 1 - Math.pow(1 - riseT, 2);
      var height = e.targetHeight * easedT;
      e.mesh.position.copy(e.basePos.clone().add(e.normal.clone().multiplyScalar(height)));
      // Widen as it rises
      var stemWidth = 0.6 + easedT * 1.0 + (e.segIdx / e.totalSegs) * 0.5;
      e.mesh.scale.set(stemWidth, stemWidth, stemWidth);
      e.mesh.material.opacity = Math.max(0, 0.65 - Math.max(0, e.t - 1.5) * 0.18);
      if(e.t > 5){
        globeGroup.remove(e.mesh); e.mesh.geometry.dispose(); e.mesh.material.dispose(); e.done = true;
      }
    }

    // ── MUSHROOM CAP: spheres cluster at top, spread outward ──
    if(e.type === 'mushroom_cap'){
      var riseDuration = 1.2;
      var riseT = Math.min(e.t / riseDuration, 1);
      var easedT = 1 - Math.pow(1 - riseT, 2);
      var height = e.targetHeight * easedT;
      // Tangent vectors for spread
      var tangent1 = new THREE.Vector3(1,0,0).cross(e.normal).normalize();
      if(tangent1.length() < 0.1) tangent1 = new THREE.Vector3(0,1,0).cross(e.normal).normalize();
      var tangent2 = e.normal.clone().cross(tangent1).normalize();
      var spreadAmt = e.capSpread * easedT;
      var offset = e.normal.clone().multiplyScalar(height)
        .add(tangent1.clone().multiplyScalar(Math.cos(e.capAngle) * spreadAmt))
        .add(tangent2.clone().multiplyScalar(Math.sin(e.capAngle) * spreadAmt));
      e.mesh.position.copy(e.basePos.clone().add(offset));
      var s = 0.3 + easedT * 1.5;
      e.mesh.scale.set(s, s * 0.65, s);  // oblate
      e.mesh.material.opacity = Math.max(0, 0.6 - Math.max(0, e.t - 2) * 0.15);
      if(e.t > 5.5){
        globeGroup.remove(e.mesh); e.mesh.geometry.dispose(); e.mesh.material.dispose(); e.done = true;
      }
    }

    // ── MUSHROOM DOME: bright top glow ──
    if(e.type === 'mushroom_dome'){
      var riseDuration = 1.3;
      var riseT = Math.min(e.t / riseDuration, 1);
      var easedT = 1 - Math.pow(1 - riseT, 2);
      var height = 0.4 * easedT;
      e.mesh.position.copy(e.basePos.clone().add(e.normal.clone().multiplyScalar(height)));
      var s = 0.2 + easedT * 1.5;
      e.mesh.scale.set(s, s * 0.55, s);
      e.mesh.material.opacity = Math.max(0, 0.45 - Math.max(0, e.t - 1.5) * 0.1);
      var bright = Math.max(0.3, 1 - e.t * 0.2);
      e.mesh.material.color.setRGB(bright, bright * 0.55, bright * 0.15);
      if(e.t > 5.5){
        globeGroup.remove(e.mesh); e.mesh.geometry.dispose(); e.mesh.material.dispose(); e.done = true;
      }
    }

    // ── DEBRIS: particles with physics ──
    if(e.type === 'debris'){
      e.mesh.position.add(e.vel);
      var gravity = e.mesh.position.clone().normalize().multiplyScalar(-0.00012);
      e.vel.add(gravity);
      e.vel.multiplyScalar(0.982);
      e.mesh.material.opacity = Math.max(0, 0.85 - e.t * 0.35);
      var s = Math.max(0.2, 1 - e.t * 0.25);
      e.mesh.scale.set(s, s, s);
      if(e.t > 3){
        globeGroup.remove(e.mesh); e.mesh.geometry.dispose(); e.mesh.material.dispose(); e.done = true;
      }
    }

    // ── EMBER: lingering glow, slow pulse + fade ──
    if(e.type === 'ember'){
      var pulse = 0.3 + Math.sin(e.t * 2) * 0.1;
      e.mesh.material.opacity = Math.max(0, pulse - e.t * 0.025);
      var s = 1 + e.t * 0.15;
      e.mesh.scale.set(s, s, s);
      if(e.t > 10){
        globeGroup.remove(e.mesh); e.mesh.geometry.dispose(); e.mesh.material.dispose(); e.done = true;
      }
    }
  });
  explosions = explosions.filter(function(e){ return !e.done; });
}
function aiTurn(){
  gamePhase = 'AI_TURN';
  document.getElementById('gamePhaseHeader').innerHTML = '☢ ENEMY RETALIATION...';
  updateMobileBar();
  recomputeDefcon();
  addLog('⚠ Enemy nations are retaliating!');
  showToast('☢ Enemy retaliation incoming', 't-danger');
  var aiDelay = 0;
  aiNations.forEach(function(ai){
    if(ai.warheads <= 0 || ai.cities.every(function(c){ return c.pop<=0; })) return;
    var numStrikes = Math.min(ai.warheads, Math.ceil(Math.random()*2));
    for(var i = 0; i < numStrikes; i++){
      var aliveCities = playerNation.cities.filter(function(c){ return c.pop>0; });
      if(aliveCities.length === 0) break;
      var target = aliveCities[Math.floor(Math.random()*aliveCities.length)];
      var tIdx = playerNation.cities.indexOf(target);
      var aliveAiCities = ai.cities.filter(function(c){ return c.pop>0; });
      if(aliveAiCities.length === 0) break;
      var aiCity = aliveAiCities[Math.floor(Math.random()*aliveAiCities.length)];
      ai.warheads--;
      (function(a, ac, tg, ti){
        setTimeout(function(){
          addLog('🚀 ' + a.flag + ' ' + a.name + ' launched at ' + tg.name + '!');
          launchOneMissile(ac, tg, playerNation, ti);
        }, aiDelay);
      })(ai, aiCity, target, tIdx);
      aiDelay += 600;
    }
  });
  setTimeout(function(){ setTimeout(endTurn, 2000); }, aiDelay + 3000);
}

function endTurn(){
  var playerAlive = playerNation.cities.some(function(c){ return c.pop>0; });
  var anyEnemyAlive = aiNations.some(function(n){ return n.cities.some(function(c){ return c.pop>0; }) && n.warheads > 0; });
  // Apocalypse always supersedes the other outcomes — even a "winner" can lose the planet
  if(isApocalypse()){ gameOver('apocalypse'); return; }
  if(!playerAlive){ gameOver('defeat'); return; }
  // Win if no enemy nation has both surviving cities and warheads, OR if all enemies fully destroyed
  if(!anyEnemyAlive){
    gameOver(isPyrrhic() ? 'pyrrhic' : 'victory');
    return;
  }
  turnNumber++;
  gamePhase = 'PLAYING';
  document.getElementById('gamePhaseHeader').innerHTML = '☢ TURN ' + turnNumber + ' — SELECT TARGETS';
  document.getElementById('gamePhaseHeader').style.color = 'var(--accent2)';
  addLog('── Turn ' + turnNumber + ' ──');
  recomputeDefcon();
  updatePlayerHUD();
  renderGlobalStats();
  updateMobileBar();
  createCityMarkers();
}

// Outcome metadata for the end screen
var OUTCOME_META = {
  victory:    { title:'VICTORY',         sub:'Enemies neutralized \u2014 Earth endures.',           icon:'\u2622\uFE0F', color:'var(--green)'  },
  pyrrhic:    { title:'PYRRHIC VICTORY', sub:'You won the war and broke the world doing it.',   icon:'\u2620\uFE0F', color:'var(--orange)' },
  apocalypse: { title:'APOCALYPSE',      sub:'The Earth is uninhabitable. Nobody won.',         icon:'\uD83C\uDF0D', color:'var(--red)'    },
  defeat:     { title:'DEFEAT',          sub:'Your nation has fallen.',                         icon:'\u2620\uFE0F', color:'var(--red)'    }
};

function getWorldPopAlive(){
  return liveNations.reduce(function(s,n){ return s + n.cities.reduce(function(t,c){ return t + c.pop; }, 0); }, 0);
}
function getWorldDestroyedFrac(){
  if(!INITIAL_WORLD_POP) return 0;
  return Math.min(1, Math.max(0, 1 - getWorldPopAlive() / INITIAL_WORLD_POP));
}
function isApocalypse(){
  return getWorldDestroyedFrac() >= APOCALYPSE_POP_FRAC || destroyedNationIds.size >= APOCALYPSE_NATIONS;
}
function isPyrrhic(){
  return getWorldDestroyedFrac() >= PYRRHIC_POP_FRAC || destroyedNationIds.size >= PYRRHIC_NATIONS;
}
// Called whenever a city is hit \u2014 ends the game immediately if the planet is dead
function checkApocalypse(){
  if(gamePhase === 'GAME_OVER') return;
  if(isApocalypse()){
    addLog('\uD83C\uDF0D PLANETARY COLLAPSE \u2014 Earth is uninhabitable.', 'destroy');
    gameOver('apocalypse');
  }
}

function gameOver(outcome){
  if(outcome === true) outcome = 'victory';
  else if(outcome === false) outcome = 'defeat';
  if(gamePhase === 'GAME_OVER') return;
  gamePhase = 'GAME_OVER';
  setDefcon(1);
  updateMobileBar();
  var meta = OUTCOME_META[outcome] || OUTCOME_META.defeat;
  var title = meta.title, sub = meta.sub, icon = meta.icon, color = meta.color;
  document.getElementById('gamePhaseHeader').innerHTML = title;
  document.getElementById('gamePhaseHeader').style.color = color;
  addLog(title + ' — ' + sub, 'info');
  addLog('Total casualties: ' + formatNum(totalKills), 'hit');

  // Count stats
  var enemiesDestroyed = destroyedNationIds.size;
  var playerCitiesAlive = playerNation.cities.filter(function(c){return c.pop>0;}).length;
  var playerCitiesTotal = playerNation.cities.length;
  var warheadsUsed = NATIONS.find(function(n){return n.id===playerNation.id;}).warheads - playerNation.warheads;

  // Per-nation casualty breakdown (sorted desc, exclude player's own casualties row from list)
  var nationRows = liveNations
    .filter(function(n){ return (n.casualties || 0) > 0; })
    .sort(function(a, b){ return (b.casualties || 0) - (a.casualties || 0); })
    .map(function(n){
      var dead = destroyedNationIds.has(n.id);
      var isPlayer = n.id === playerNation.id;
      var label = (isPlayer ? '<span style="color:var(--blue)">YOU</span> ' : '') + n.flag + ' ' + n.name;
      var status = dead ? '<span style="color:var(--red);font-family:JetBrains Mono,monospace;font-size:8px;letter-spacing:1px">DESTROYED</span>'
                        : '<span style="color:var(--text3);font-family:JetBrains Mono,monospace;font-size:8px;letter-spacing:1px">SURVIVED</span>';
      return '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;margin-bottom:3px">' +
             '<div style="font-size:11px;color:var(--text)">' + label + '</div>' +
             '<div style="display:flex;align-items:center;gap:10px">' +
               '<div style="font-family:JetBrains Mono,monospace;font-size:11px;color:var(--red);font-weight:600">' + formatNum(n.casualties || 0) + '</div>' +
               status +
             '</div>' +
             '</div>';
    }).join('');
  var breakdownHTML = nationRows ? (
    '<div style="text-align:left;margin-bottom:20px">' +
    '<div style="font-family:JetBrains Mono,monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:8px">Casualties by Nation</div>' +
    nationRows +
    '</div>'
  ) : '';

  var earthIntactPct = Math.max(0, Math.round((1 - getWorldDestroyedFrac()) * 100));
  var earthColor = earthIntactPct >= 70 ? 'var(--green)' : earthIntactPct >= 45 ? 'var(--orange)' : 'var(--red)';
  var nationsSurviving = liveNations.filter(function(n){ return !destroyedNationIds.has(n.id); }).length;

  document.getElementById('gameOverOverlay').innerHTML =
    '<div class="gameover-overlay">' +
    '<div class="gameover-card">' +
    '<div class="gameover-icon">' + icon + '</div>' +
    '<div class="gameover-title" style="color:' + color + '">' + title + '</div>' +
    '<div class="gameover-sub">' + sub + '</div>' +
    '<div class="gameover-stats">' +
    '<div class="gameover-stat"><div class="val" style="color:' + earthColor + '">' + earthIntactPct + '%</div><div class="lbl">Earth Intact</div></div>' +
    '<div class="gameover-stat"><div class="val" style="color:var(--red)">' + formatNum(totalKills) + '</div><div class="lbl">Total Casualties</div></div>' +
    '<div class="gameover-stat"><div class="val" style="color:var(--orange)">' + turnNumber + '</div><div class="lbl">Turns Played</div></div>' +
    '<div class="gameover-stat"><div class="val" style="color:var(--red)">' + warheadsUsed + '</div><div class="lbl">Warheads Used</div></div>' +
    '<div class="gameover-stat"><div class="val" style="color:var(--green)">' + playerCitiesAlive + '/' + playerCitiesTotal + '</div><div class="lbl">Cities Surviving</div></div>' +
    '<div class="gameover-stat"><div class="val" style="color:var(--red)">' + enemiesDestroyed + '/' + liveNations.length + '</div><div class="lbl">Nations Destroyed</div></div>' +
    '<div class="gameover-stat"><div class="val" style="color:var(--blue)">' + nationsSurviving + '</div><div class="lbl">Nations Surviving</div></div>' +
    '</div>' +
    breakdownHTML +
    '<button class="gameover-replay" onclick="location.reload()">Play Again</button>' +
    '</div></div>';
}

function addLog(msg, type){
  var t = type || '';
  // Auto-detect type from content if not provided
  if(!t){
    if(msg.indexOf('LAUNCH')!==-1 || msg.indexOf('launched')!==-1) t='launch';
    else if(msg.indexOf('intercepted')!==-1) t='defend';
    else if(msg.indexOf('hit!')!==-1 || msg.indexOf('casualties')!==-1) t='hit';
    else if(msg.indexOf('DESTROYED')!==-1) t='destroy';
    else t='info';
  }
  gameLog.unshift({msg:msg, type:t});
  if(gameLog.length > 50) gameLog.pop();
  var el = document.getElementById('logEntries');
  if(el) el.innerHTML = gameLog.map(function(entry){
    var cls = 'log-entry log-' + entry.type;
    return '<div class="' + cls + '">' + entry.msg + '</div>';
  }).join('');
}

// ═══════════════════════════════════════════════════════════════
// COUNTRY DESTRUCTION SYSTEM — Catastrophic visual effects
// When a nation loses all cities, its territory burns on the globe
// ═══════════════════════════════════════════════════════════════

// Map nation IDs to ISO codes for matching country polygons
const NATION_TO_ISO = {
  'usa':'840','russia':'643','china':'156','uk':'826','france':'250',
  'india':'356','pakistan':'586','israel':'376','nkorea':'408','iran':'364'
};

function checkNationDestroyed(nation){
  var allDead = nation.cities.every(function(c){ return c.pop <= 0; });
  if(allDead && !destroyedNationIds.has(nation.id)){
    destroyedNationIds.add(nation.id);
    addLog('☠️ ' + nation.flag + ' ' + nation.name + ' HAS BEEN DESTROYED!');
    applyDestructionVisuals(nation);
  }
}

function applyDestructionVisuals(nation){
  var isoCode = NATION_TO_ISO[nation.id];
  if(!isoCode) return;

  // ── 1. Turn country polygons to scorched burning look ──
  countryFills.forEach(function(mesh){
    if(mesh.userData.countryId === isoCode){
      mesh.userData.destroyed = true;
      mesh.userData.destroyTime = performance.now();
      mesh.material.color.set('#4a0800');
      mesh.material.opacity = 0.35;
      mesh.material.transparent = true;
    }
  });

  // ── 2. Turn borders to fiery red/orange ──
  // We can't easily match borders to specific countries in the current mesh structure,
  // so we add fire effects on all city locations and across the territory

  // ── 3. Add 3D fire effects across the nation's territory ──
  var cities = nation.cities;
  cities.forEach(function(city){
    // Multiple fire points per city for coverage
    for(var f = 0; f < 5; f++){
      var offsetLat = city.lat + (Math.random() - 0.5) * 3;
      var offsetLng = city.lng + (Math.random() - 0.5) * 3;
      addFireEffect3D(offsetLat, offsetLng);
    }
    // Large scorch mark at each city
    addScorchMark3D(city.lat, city.lng);
  });

  // ── 4. Add fire points between cities for territory coverage ──
  for(var i = 0; i < cities.length - 1; i++){
    for(var j = i + 1; j < cities.length; j++){
      var nPoints = 3 + Math.floor(Math.random() * 3);
      for(var p = 0; p < nPoints; p++){
        var t = (p + 1) / (nPoints + 1) + (Math.random() - 0.5) * 0.15;
        var lat = cities[i].lat + (cities[j].lat - cities[i].lat) * t + (Math.random() - 0.5) * 4;
        var lng = cities[i].lng + (cities[j].lng - cities[i].lng) * t + (Math.random() - 0.5) * 4;
        addFireEffect3D(lat, lng);
      }
    }
  }

  // ── 5. Add HTML overlay destruction labels ──
  var centerLat = cities.reduce(function(s,c){return s+c.lat;},0) / cities.length;
  var centerLng = cities.reduce(function(s,c){return s+c.lng;},0) / cities.length;
  addDestructionLabel(centerLat, centerLng, nation.flag + ' DESTROYED');
}

function addFireEffect3D(lat, lng){
  var pos = latLngToVec3(lat, lng, globeRadius * 1.005);
  var N = pos.clone().normalize();

  // Fire glow sphere (persistent, animated in update loop)
  var fSize = 0.008 + Math.random() * 0.015;
  var fGeo = new THREE.SphereGeometry(fSize, 8, 8);
  var fireColors = [0xff2200, 0xff4400, 0xff6600, 0xffaa00, 0xff3311];
  var fColor = fireColors[Math.floor(Math.random() * fireColors.length)];
  var fMat = new THREE.MeshBasicMaterial({color: fColor, transparent: true, opacity: 0.5, depthWrite: false});
  var fMesh = new THREE.Mesh(fGeo, fMat);
  fMesh.position.copy(pos);
  globeGroup.add(fMesh);

  // Smoke plume above fire
  var smSize = 0.012 + Math.random() * 0.02;
  var smGeo = new THREE.SphereGeometry(smSize, 6, 6);
  var smMat = new THREE.MeshBasicMaterial({color: 0x332211, transparent: true, opacity: 0.25, depthWrite: false});
  var smMesh = new THREE.Mesh(smGeo, smMat);
  smMesh.position.copy(pos.clone().add(N.clone().multiplyScalar(0.03)));
  globeGroup.add(smMesh);

  destructionEffects3D.push({
    type: 'fire',
    mesh: fMesh,
    smoke: smMesh,
    basePos: pos.clone(),
    normal: N.clone(),
    phase: Math.random() * Math.PI * 2,
    speed: 2 + Math.random() * 3,
    baseOpacity: 0.3 + Math.random() * 0.4,
    baseSize: fSize
  });
}

function addScorchMark3D(lat, lng){
  var pos = latLngToVec3(lat, lng, globeRadius * 1.0003);
  var N = pos.clone().normalize();

  // Large scorched area
  var scSize = 0.06 + Math.random() * 0.04;
  var scGeo = new THREE.CircleGeometry(scSize, 24);
  var scMat = new THREE.MeshBasicMaterial({
    color: 0x1a0500, transparent: true, opacity: 0.6,
    side: THREE.DoubleSide, depthWrite: false
  });
  var scMesh = new THREE.Mesh(scGeo, scMat);
  scMesh.position.copy(pos);
  scMesh.lookAt(scMesh.position.clone().add(N));
  globeGroup.add(scMesh);

  // Fiery ring around scorch mark
  var ringGeo = new THREE.RingGeometry(scSize * 0.8, scSize * 1.1, 32);
  var ringMat = new THREE.MeshBasicMaterial({
    color: 0xff3300, transparent: true, opacity: 0.2,
    side: THREE.DoubleSide, depthWrite: false
  });
  var ringMesh = new THREE.Mesh(ringGeo, ringMat);
  ringMesh.position.copy(pos.clone().add(N.clone().multiplyScalar(0.0005)));
  ringMesh.lookAt(ringMesh.position.clone().add(N));
  globeGroup.add(ringMesh);

  destructionEffects3D.push({
    type: 'scorch_ring',
    mesh: ringMesh,
    phase: Math.random() * Math.PI * 2,
    speed: 1.5 + Math.random()
  });
}

function addDestructionLabel(lat, lng, text){
  var pos3d = latLngToVec3(lat, lng, globeRadius * 1.02);
  destructionMarkerEls.push({
    pos3d: pos3d,
    text: text,
    el: null // created in update
  });
}

// ── Animate destruction effects (called every frame) ──
function updateDestructionEffects(t){
  // 3D fire/smoke animation
  destructionEffects3D.forEach(function(ef){
    if(ef.type === 'fire'){
      // Flickering fire
      var flicker = Math.sin(t * ef.speed + ef.phase) * 0.5 + 0.5;
      var flicker2 = Math.sin(t * ef.speed * 1.7 + ef.phase * 2.3) * 0.5 + 0.5;
      ef.mesh.material.opacity = ef.baseOpacity * (0.4 + flicker * 0.6);
      var s = 0.7 + flicker2 * 0.8;
      ef.mesh.scale.set(s, s, s);
      // Move fire slightly along normal (licking flames)
      var rise = 0.003 + flicker * 0.008;
      ef.mesh.position.copy(ef.basePos.clone().add(ef.normal.clone().multiplyScalar(rise)));
      // Color shift orange<->red
      var r = 0.8 + flicker * 0.2;
      var g = 0.15 + flicker2 * 0.25;
      ef.mesh.material.color.setRGB(r, g, 0);

      // Smoke rises and pulses
      if(ef.smoke){
        var smokeRise = 0.02 + Math.sin(t * 0.8 + ef.phase) * 0.015 + flicker * 0.02;
        ef.smoke.position.copy(ef.basePos.clone().add(ef.normal.clone().multiplyScalar(smokeRise)));
        ef.smoke.material.opacity = 0.1 + flicker2 * 0.15;
        var ss = 0.8 + Math.sin(t * 0.5 + ef.phase) * 0.4;
        ef.smoke.scale.set(ss, ss, ss);
      }
    }
    if(ef.type === 'scorch_ring'){
      // Pulsing fiery border
      var pulse = Math.sin(t * ef.speed + ef.phase) * 0.5 + 0.5;
      ef.mesh.material.opacity = 0.1 + pulse * 0.2;
      var r = 0.7 + pulse * 0.3;
      var g = 0.1 + pulse * 0.15;
      ef.mesh.material.color.setRGB(r, g, 0);
    }
  });

  // Animate destroyed country polygon fills
  countryFills.forEach(function(mesh){
    if(mesh.userData.destroyed){
      var elapsed = (performance.now() - mesh.userData.destroyTime) / 1000;
      var pulse = Math.sin(elapsed * 2) * 0.5 + 0.5;
      var pulse2 = Math.sin(elapsed * 3.7 + 1.2) * 0.5 + 0.5;
      // Alternate between dark scorched and fiery red
      var r = 0.15 + pulse * 0.2;
      var g = 0.02 + pulse2 * 0.04;
      var b = 0;
      mesh.material.color.setRGB(r, g, b);
      mesh.material.opacity = 0.25 + pulse * 0.15;
    }
  });

  // Update HTML destruction labels (project to screen)
  var W = renderer.domElement.clientWidth;
  var H = renderer.domElement.clientHeight;
  var hw = W / 2;
  var hh = H / 2;
  var container = document.getElementById('htmlMarkers');

  destructionMarkerEls.forEach(function(dm){
    if(!dm.el){
      dm.el = document.createElement('div');
      dm.el.className = 'destroyed-label';
      dm.el.textContent = dm.text;
      container.appendChild(dm.el);
    }
    var pos = _tempPos.copy(dm.pos3d).applyMatrix4(globeGroup.matrixWorld);
    _tempViewDir.subVectors(camera.position, pos).normalize();
    _tempNormal.copy(pos).normalize();
    var isVisible = _tempNormal.dot(_tempViewDir) > 0.1;
    if(isVisible){
      pos.project(camera);
      dm.el.style.left = ((pos.x * hw) + hw) + 'px';
      dm.el.style.top = (-(pos.y * hh) + hh) + 'px';
      dm.el.style.display = 'block';
    } else {
      dm.el.style.display = 'none';
    }
  });
}

// ═══════════════════════════════════════════════════════════════
// EXPLOSION V3 — NEW SYSTEM (built separately for safe testing)
// Realistic nuclear: flash → fireball → shockwave → mushroom → debris
// All effects on globe only. No full-screen flash.
// ═══════════════════════════════════════════════════════════════

var explosionsV3 = []; // separate array from old system

function triggerExplosionV3(lat, lng){
  var pos = latLngToVec3(lat, lng, globeRadius * 1.003);
  var N = pos.clone().normalize();
  var T1 = new THREE.Vector3(1,0,0).cross(N).normalize();
  if(T1.lengthSq() < 0.01) T1 = new THREE.Vector3(0,1,0).cross(N).normalize();
  var T2 = N.clone().cross(T1).normalize();

  var ADD = THREE.AdditiveBlending;

  // ──────────────────────────────────────────────
  // PER-DETONATION SEED — every explosion is unique
  // ──────────────────────────────────────────────
  // Global scale: 10x smaller than legacy V3
  var V3_SCALE = 0.10;

  // Yield class: tiny (35%), small (30%), standard (20%), large (10%), mega (5%)
  // Wider spread → much more visible size variance per shot
  var yRoll = Math.random();
  var yieldClass, yieldScale, yieldStem, yieldCap, yieldDuration;
  if(yRoll < 0.35){       yieldClass='tiny';     yieldScale=0.55; yieldStem=0.14; yieldCap=0.16; yieldDuration=12; }
  else if(yRoll < 0.65){  yieldClass='small';    yieldScale=0.85; yieldStem=0.20; yieldCap=0.22; yieldDuration=15; }
  else if(yRoll < 0.85){  yieldClass='standard'; yieldScale=1.20; yieldStem=0.30; yieldCap=0.34; yieldDuration=22; }
  else if(yRoll < 0.95){  yieldClass='large';    yieldScale=1.70; yieldStem=0.46; yieldCap=0.50; yieldDuration=30; }
  else{                   yieldClass='mega';     yieldScale=2.40; yieldStem=0.62; yieldCap=0.70; yieldDuration=40; }

  var sVar = V3_SCALE * yieldScale * (0.78 + Math.random()*0.44); // wider per-shot jitter
  var cShift = (Math.random()-0.5)*0.55;               // wider hue jitter (red↔yellow↔green-tinge)
  // Occasional exotic tint: blue/purple/teal fireballs (rare neutron-bomb look)
  var exoticRoll = Math.random();
  var bShift = exoticRoll < 0.12 ? (Math.random()*0.45) : (Math.random()*0.10);
  var gShift = (Math.random()-0.5)*0.18;
  var asymmetry = (Math.random()-0.5)*0.5;             // cap leans
  // Depth jitter — push detonation slightly above globe surface for parallax (always >=0)
  var depthBoost = Math.random()*0.012;
  pos = pos.clone().add(N.clone().multiplyScalar(depthBoost));

  // Wind vector in tangent plane — drifts cap and smoke laterally
  var windAng = Math.random()*Math.PI*2;
  var windStrength = 0.005 + Math.random()*0.012;
  var windVec = T1.clone().multiplyScalar(Math.cos(windAng)*windStrength)
              .add(T2.clone().multiplyScalar(Math.sin(windAng)*windStrength));

  // Stem profile randomization
  var stemTwist = (Math.random()-0.5)*1.2;             // twist around vertical axis
  var stemTilt = (Math.random()-0.5)*0.06;             // slight lean

  // ──────────────────────────────────────────────
  // 0. WILSON CONDENSATION HALO — pressure-drop white ring
  // ──────────────────────────────────────────────
  var wGeo = new THREE.SphereGeometry(0.04*sVar, 24, 24);
  var wMat = new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0, depthWrite:false, blending:ADD});
  var wMesh = new THREE.Mesh(wGeo, wMat);
  wMesh.position.copy(pos.clone().add(N.clone().multiplyScalar(0.005)));
  globeGroup.add(wMesh);
  explosionsV3.push({type:'v3_wilson', mesh:wMesh, t:0, sVar:sVar});

  // ──────────────────────────────────────────────
  // 1. INITIAL FLASH — pinpoint + glare + bloom halo (additive)
  // ──────────────────────────────────────────────
  var flGeo = new THREE.SphereGeometry(0.014*sVar, 20, 20);
  var flMat = new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:1, depthWrite:false, blending:ADD});
  var fl = new THREE.Mesh(flGeo, flMat); fl.position.copy(pos);
  globeGroup.add(fl);
  explosionsV3.push({type:'v3_flash', mesh:fl, t:0, sVar:sVar});

  var glGeo = new THREE.SphereGeometry(0.022*sVar, 18, 18);
  var glMat = new THREE.MeshBasicMaterial({color:0xddeeff, transparent:true, opacity:0.95, depthWrite:false, blending:ADD});
  var gl = new THREE.Mesh(glGeo, glMat); gl.position.copy(pos);
  globeGroup.add(gl);
  explosionsV3.push({type:'v3_glare', mesh:gl, t:0, sVar:sVar});

  var haGeo = new THREE.SphereGeometry(0.05*sVar, 16, 16);
  var haMat = new THREE.MeshBasicMaterial({color:0xfff2c0, transparent:true, opacity:0.7, depthWrite:false, blending:ADD});
  var ha = new THREE.Mesh(haGeo, haMat); ha.position.copy(pos);
  globeGroup.add(ha);
  explosionsV3.push({type:'v3_halo', mesh:ha, t:0, sVar:sVar});

  // ──────────────────────────────────────────────
  // 2. GLOBE SHAKE — proportional to yield
  // ──────────────────────────────────────────────
  var gOX=globeGroup.position.x, gOY=globeGroup.position.y, gOZ=globeGroup.position.z;
  var skT=0;
  // Smaller explosions → smaller shake (proportional to yield class)
  var shakeAmpBase = 0.012 + (yieldClass==='mega'?0.025 : yieldClass==='large'?0.014 : yieldClass==='standard'?0.006 : yieldClass==='small'?0.003 : 0.001);
  var skI=setInterval(function(){
    skT+=0.025;
    if(skT>1.4){clearInterval(skI);globeGroup.position.set(gOX,gOY,gOZ);return;}
    var amp=skT<0.10? shakeAmpBase*(1-skT/0.10) : (shakeAmpBase*0.35)*Math.pow(1-skT*0.75,4);
    globeGroup.position.x=gOX+(Math.random()-0.5)*amp;
    globeGroup.position.y=gOY+(Math.random()-0.5)*amp;
    globeGroup.position.z=gOZ+(Math.random()-0.5)*amp*0.3;
  },16);

  // ──────────────────────────────────────────────
  // 3. FIREBALL — incandescent plasma, blackbody-cooling, slower
  // ──────────────────────────────────────────────
  setTimeout(function(){
    var fbGeo = new THREE.SphereGeometry(0.025*sVar, 24, 24);
    var fbMat = new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.95, depthWrite:false, blending:ADD});
    var fb = new THREE.Mesh(fbGeo, fbMat);
    fb.position.copy(pos.clone().add(N.clone().multiplyScalar(0.012)));
    globeGroup.add(fb);
    explosionsV3.push({type:'v3_fireball', mesh:fb, t:0, N:N.clone(), base:pos.clone(), sVar:sVar, cShift:cShift, bShift:bShift, gShift:gShift});

    var icGeo = new THREE.SphereGeometry(0.012*sVar, 16, 16);
    var icMat = new THREE.MeshBasicMaterial({color:0xffffee, transparent:true, opacity:1, depthWrite:false, blending:ADD});
    var ic = new THREE.Mesh(icGeo, icMat); ic.position.copy(fb.position);
    globeGroup.add(ic);
    explosionsV3.push({type:'v3_core', mesh:ic, t:0, N:N.clone(), base:pos.clone(), sVar:sVar});

    var bpGeo = new THREE.SphereGeometry(0.008*sVar, 12, 12);
    var bpMat = new THREE.MeshBasicMaterial({color:0xaaccff, transparent:true, opacity:0.9, depthWrite:false, blending:ADD});
    var bp = new THREE.Mesh(bpGeo, bpMat); bp.position.copy(fb.position);
    globeGroup.add(bp);
    explosionsV3.push({type:'v3_plasma', mesh:bp, t:0, N:N.clone(), base:pos.clone(), sVar:sVar});
  }, 35);

  // ──────────────────────────────────────────────
  // 4. SHOCKWAVES — Mach-disk style ground rings (3 layers + reflection)
  // ──────────────────────────────────────────────
  setTimeout(function(){
    for(var i=0;i<3;i++){
      (function(idx){
        var inner = 0.004 + idx*0.003;
        var outer = inner + 0.004 + idx*0.002;
        var rGeo = new THREE.RingGeometry(inner, outer, 96);
        var col = idx===0 ? 0xffffff : (idx===1 ? 0xffd88a : 0xff7733);
        var rMat = new THREE.MeshBasicMaterial({
          color: col, transparent:true,
          opacity:0.85-idx*0.20, side:THREE.DoubleSide, depthWrite:false,
          blending: idx<2 ? ADD : THREE.NormalBlending
        });
        var rMesh = new THREE.Mesh(rGeo, rMat);
        rMesh.position.copy(pos.clone().add(N.clone().multiplyScalar(0.0025)));
        rMesh.lookAt(rMesh.position.clone().add(N));
        globeGroup.add(rMesh);
        // Slow shockwave by ~2x for simulation feel
        explosionsV3.push({type:'v3_shockwave', mesh:rMesh, t:0, idx:idx, sVar:sVar, spd:(18-idx*4)*sVar});
      })(i);
    }

    var mGeo = new THREE.RingGeometry(0.002, 0.005, 64);
    var mMat = new THREE.MeshBasicMaterial({color:0xfff8dd, transparent:true, opacity:0.55, side:THREE.DoubleSide, depthWrite:false, blending:ADD});
    var mMesh = new THREE.Mesh(mGeo, mMat);
    mMesh.position.copy(pos.clone().add(N.clone().multiplyScalar(0.0018)));
    mMesh.lookAt(mMesh.position.clone().add(N));
    globeGroup.add(mMesh);
    explosionsV3.push({type:'v3_mach', mesh:mMesh, t:0, sVar:sVar});
  }, 50);

  // ──────────────────────────────────────────────
  // 5. THERMAL GLOW — burned ground + inner white-hot
  // ──────────────────────────────────────────────
  setTimeout(function(){
    var tGeo = new THREE.CircleGeometry(0.04*sVar, 40);
    var tMat = new THREE.MeshBasicMaterial({color:0xff5500, transparent:true, opacity:0.55, side:THREE.DoubleSide, depthWrite:false, blending:ADD});
    var tMesh = new THREE.Mesh(tGeo, tMat);
    tMesh.position.copy(pos.clone().add(N.clone().multiplyScalar(0.0012)));

    globeGroup.add(tMesh);
    explosionsV3.push({type:'v3_thermal', mesh:tMesh, t:0, sVar:sVar});

    var thGeo = new THREE.CircleGeometry(0.018*sVar, 32);
    var thMat = new THREE.MeshBasicMaterial({color:0xffeebb, transparent:true, opacity:0.9, side:THREE.DoubleSide, depthWrite:false, blending:ADD});

  // ──────────────────────────────────────────────
  // 6. GROUND DUST PARTICLE BURST — radial blast on ground
  // ──────────────────────────────────────────────
  setTimeout(function(){
    var nDust = Math.floor(120 * sVar);
    var dustPos = new Float32Array(nDust*3);
    var dustVel = [];
    for(var i=0; i<nDust; i++){
      dustPos[i*3]=pos.x; dustPos[i*3+1]=pos.y; dustPos[i*3+2]=pos.z;

      var v = T1.clone().multiplyScalar(Math.cos(ang)*spd)

    }

    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));

    });

    explosionsV3.push({type:'v3_dust', mesh:dustPts, t:0, vel:dustVel, N:N.clone(), n:nDust, sVar:sVar});
  }, 80);

  // ──────────────────────────────────────────────
  // 7. MUSHROOM STEM — slow rise (4-6s), turbulent column with internal heat
  // ──────────────────────────────────────────────
  setTimeout(function(){
    var stemSegs = 22;
    var stemHeight = yieldStem * sVar;
    var stemRiseDur = 4.2 + (yieldClass==='mega'?2.0 : yieldClass==='large'?1.0 : 0); // seconds for stem to fully rise
    for(var s=0; s<stemSegs; s++){
      var frac = s/stemSegs;
      // Hourglass profile: thicker at base and top, narrower middle
      var widthMul = 1.0 - 0.42*Math.sin(frac*Math.PI);
      var sR = (0.014*widthMul - s*0.00015)*sVar;
      var sGeo = new THREE.SphereGeometry(sR, 12, 12);
      var heat = Math.max(0, 1 - frac*1.2);
      var r = 0.30 + heat*0.50 + cShift, g = 0.16 + heat*0.20, b = 0.08 + heat*0.05;
      var sMat = new THREE.MeshBasicMaterial({color:new THREE.Color(r,g,b), transparent:true, opacity:0.62, depthWrite:false});
      var sP = new THREE.Mesh(sGeo, sMat);
      sP.position.copy(pos);
      globeGroup.add(sP);
      explosionsV3.push({
        type:'v3_stem', mesh:sP, t:0, N:N.clone(), base:pos.clone(),
        T1:T1.clone(), T2:T2.clone(),
        seg:s, total:stemSegs, sVar:sVar,
        tgtH: stemHeight * (0.05 + frac*0.95),
        riseDur: stemRiseDur,
        wobblePhase: Math.random()*Math.PI*2,
        wobbleAmp: 0.008 + (1-frac)*0.005,
        twist: stemTwist * frac,
        tilt: stemTilt,
        startColor:new THREE.Color(r,g,b),
        widthBase: 0.55 + widthMul*0.65
      });
    }

    // Stem inner heat glow points (ascending, additive)
    for(var g=0; g<5; g++){
      var glH = stemHeight * (0.10 + g*0.18);
      var glGeo2 = new THREE.SphereGeometry(0.012*sVar, 14, 14);
      var glMat2 = new THREE.MeshBasicMaterial({color:0xff6633, transparent:true, opacity:0.55, depthWrite:false, blending:ADD});
      var glM = new THREE.Mesh(glGeo2, glMat2);
      glM.position.copy(pos.clone().add(N.clone().multiplyScalar(glH*0.3)));
      globeGroup.add(glM);
      explosionsV3.push({type:'v3_stem_glow', mesh:glM, t:0, N:N.clone(), base:pos.clone(), sVar:sVar, glH:glH, idx:g, riseDur:stemRiseDur*1.2});
    }
  }, 200);

  // ──────────────────────────────────────────────
  // 8. STEM ASH PARTICLES — fine particles streaming up the column
  // ──────────────────────────────────────────────
  setTimeout(function(){
    var nAsh = Math.floor(280 * sVar);
    var ashPos = new Float32Array(nAsh*3);
    var ashData = [];
    for(var i=0; i<nAsh; i++){
      ashPos[i*3]=pos.x; ashPos[i*3+1]=pos.y; ashPos[i*3+2]=pos.z;
      ashData.push({
        riseSpd: 0.025 + Math.random()*0.04,
        startDelay: Math.random()*4.0,
        spiralR: 0.005 + Math.random()*0.012,
        spiralPhase: Math.random()*Math.PI*2,
        spiralSpd: 0.6 + Math.random()*1.2,
        maxH: yieldStem * sVar * (0.7 + Math.random()*0.3),
        life: 4 + Math.random()*4
      });
    }
    var ashGeo = new THREE.BufferGeometry();
    ashGeo.setAttribute('position', new THREE.BufferAttribute(ashPos, 3));
    var ashMat = new THREE.PointsMaterial({
      color:0xffaa55, size:0.004*sVar, transparent:true, opacity:0.75,
      depthWrite:false, sizeAttenuation:true, blending:ADD
    });
    var ashPts = new THREE.Points(ashGeo, ashMat);
    globeGroup.add(ashPts);
    explosionsV3.push({
      type:'v3_ashparticles', mesh:ashPts, t:0,
      data:ashData, n:nAsh,
      N:N.clone(), T1:T1.clone(), T2:T2.clone(), base:pos.clone(),
      sVar:sVar
    });
  }, 250);

  // ──────────────────────────────────────────────
  // 9. MUSHROOM CAP — toroidal vortex + puffs + crown disk + skirt
  //    Slow formation: 5-8s
  // ──────────────────────────────────────────────
  setTimeout(function(){
    var capDelay = (yieldClass==='mega'?2200 : yieldClass==='large'?1500 : 1200); // ms before cap forms
    var capRiseDur = 5.5 + (yieldClass==='mega'?2.5 : yieldClass==='large'?1.5 : 0);
    var capH = yieldCap * sVar;
    var capR = (0.05 + yieldCap*0.4) * sVar;

    // Toroidal cap base — rolling vortex
    var torGeo = new THREE.TorusGeometry(capR, capR*0.4, 18, 36);
    var torMat = new THREE.MeshBasicMaterial({color:0x6a4030, transparent:true, opacity:0.7, depthWrite:false});
    var tor = new THREE.Mesh(torGeo, torMat);
    tor.position.copy(pos);
    tor.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), N);
    globeGroup.add(tor);
    explosionsV3.push({
      type:'v3_torus', mesh:tor, t:0, N:N.clone(), base:pos.clone(),
      T1:T1.clone(), T2:T2.clone(),
      tgtH:capH, riseDur:capRiseDur,
      wind:windVec.clone(),
      asym:asymmetry, sVar:sVar
    });

    // Crown disk — flat oblate "hat brim" on top
    var crGeo = new THREE.SphereGeometry(capR*1.15, 24, 16);
    var crMat = new THREE.MeshBasicMaterial({color:0x554035, transparent:true, opacity:0.6, depthWrite:false});
    var crMesh = new THREE.Mesh(crGeo, crMat);
    crMesh.position.copy(pos);
    globeGroup.add(crMesh);
    explosionsV3.push({
      type:'v3_crown', mesh:crMesh, t:0, N:N.clone(), base:pos.clone(),
      T1:T1.clone(), T2:T2.clone(),
      tgtH:capH*1.05, riseDur:capRiseDur,
      wind:windVec.clone(),
      sVar:sVar, capR:capR
    });

    // Cap puffs (pyrocumulus billows around torus)
    var nCap = 18 + Math.floor(Math.random()*10);
    for(var c=0;c<nCap;c++){
      var cR = (0.025+Math.random()*0.025)*sVar;
      var cGeo = new THREE.SphereGeometry(cR, 12, 12);
      var heat = 0.4 + Math.random()*0.4;
      var cr=0.38*heat+Math.random()*0.25+cShift, cg=0.22*heat+Math.random()*0.10, cb=0.10*heat+Math.random()*0.04;
      var cMat = new THREE.MeshBasicMaterial({color:new THREE.Color(cr,cg,cb), transparent:true, opacity:0.55, depthWrite:false});
      var cP = new THREE.Mesh(cGeo, cMat);
      cP.position.copy(pos);
      globeGroup.add(cP);
      var ang = (c/nCap)*Math.PI*2 + (Math.random()-0.5)*0.6;
      var spr = capR*(0.85+Math.random()*0.55);
      explosionsV3.push({
        type:'v3_cap', mesh:cP, t:0, N:N.clone(), base:pos.clone(),
        T1:T1.clone(), T2:T2.clone(),
        ang:ang, spr:spr, sVar:sVar,
        tgtH: capH*(0.92+Math.random()*0.16),
        riseDur: capRiseDur,
        rotSpd: 0.15 + Math.random()*0.20,
        rotDir: Math.random()<0.5?1:-1,
        wind: windVec.clone(),
        startColor:new THREE.Color(cr,cg,cb)
      });
    }

    // Cap underbelly — dark blobs hanging below brim
    for(var u=0; u<10; u++){
      var uR = (0.022+Math.random()*0.014)*sVar;
      var uGeo = new THREE.SphereGeometry(uR, 12, 12);
      var uMat = new THREE.MeshBasicMaterial({color:0x251510, transparent:true, opacity:0.6, depthWrite:false});
      var uP = new THREE.Mesh(uGeo, uMat);
      uP.position.copy(pos);
      globeGroup.add(uP);
      var uAng = (u/10)*Math.PI*2 + Math.random()*0.4;
      explosionsV3.push({
        type:'v3_underbelly', mesh:uP, t:0, N:N.clone(), base:pos.clone(),
        T1:T1.clone(), T2:T2.clone(),
        ang:uAng, spr:capR*(0.7+Math.random()*0.4),
        tgtH:capH*0.85, riseDur:capRiseDur,
        wind:windVec.clone(),
        sVar:sVar
      });
    }

    // Internal hot dome (heart of mushroom — additive orange)
    var dGeo = new THREE.SphereGeometry(0.04*sVar, 18, 18);
    var dMat = new THREE.MeshBasicMaterial({color:0xff7733, transparent:true, opacity:0.65, depthWrite:false, blending:ADD});
    var dM = new THREE.Mesh(dGeo, dMat);
    dM.position.copy(pos);
    globeGroup.add(dM);
    explosionsV3.push({type:'v3_dome', mesh:dM, t:0, N:N.clone(), base:pos.clone(), sVar:sVar, tgtH:capH, riseDur:capRiseDur});

    // Cap skirt — smoke veil hanging below cap
    for(var sk=0; sk<8; sk++){
      var skR = (0.018+Math.random()*0.012)*sVar;
      var skGeo = new THREE.SphereGeometry(skR, 10, 10);
      var skGray = 0.22 + Math.random()*0.10;
      var skMat = new THREE.MeshBasicMaterial({color:new THREE.Color(skGray,skGray*0.92,skGray*0.85), transparent:true, opacity:0.45, depthWrite:false});
      var skM = new THREE.Mesh(skGeo, skMat);
      skM.position.copy(pos);
      globeGroup.add(skM);
      explosionsV3.push({
        type:'v3_skirt', mesh:skM, t:0, N:N.clone(), base:pos.clone(),
        T1:T1.clone(), T2:T2.clone(),
        ang:(sk/8)*Math.PI*2+Math.random()*0.3,
        spr:capR*(0.4+Math.random()*0.3),
        tgtH:capH*0.6, riseDur:capRiseDur,
        wind:windVec.clone(), sVar:sVar
      });
    }
  }, 800);

  // ──────────────────────────────────────────────
  // 10. CAP VORTEX PARTICLES — particles spiraling around mushroom cap
  // ──────────────────────────────────────────────
  setTimeout(function(){
    var nVortex = Math.floor(180 * sVar);
    var vPos = new Float32Array(nVortex*3);
    var vData = [];
    for(var i=0; i<nVortex; i++){

        spiralR: (0.05+Math.random()*0.04)*sVar,
        spiralPhase: Math.random()*Math.PI*2,
        spiralSpd: 0.4 + Math.random()*0.6,

    explosionsV3.push({
      type:'v3_vortexparticles', mesh:vPts, t:0,

      N:N.clone(), T1:T1.clone(), T2:T2.clone(), base:pos.clone(),

    });

  // ──────────────────────────────────────────────

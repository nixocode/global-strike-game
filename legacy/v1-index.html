  // ──────────────────────────────────────────────
  setTimeout(function(){
    var nEmb = Math.floor(80 * sVar);
    var ePos = new Float32Array(nEmb*3);
    var eData = [];
    for(var i=0; i<nEmb; i++){
      ePos[i*3]=pos.x; ePos[i*3+1]=pos.y; ePos[i*3+2]=pos.z;
      eData.push({
        spawnAt: 2.0 + Math.random()*6,
        spawnH: yieldCap*sVar*(0.7+Math.random()*0.25),
        spawnAng: Math.random()*Math.PI*2,
        spawnR: (0.03+Math.random()*0.05)*sVar,
        fallSpd: 0.015 + Math.random()*0.020,
        life: 6 + Math.random()*4
      });
    }
    var eGeo = new THREE.BufferGeometry();
    eGeo.setAttribute('position', new THREE.BufferAttribute(ePos, 3));
    var eMat = new THREE.PointsMaterial({
      color:0xff7722, size:0.003*sVar, transparent:true, opacity:0.9,
      depthWrite:false, sizeAttenuation:true, blending:ADD
    });
    var ePts = new THREE.Points(eGeo, eMat);
    globeGroup.add(ePts);
    explosionsV3.push({
      type:'v3_emberparticles', mesh:ePts, t:0,
      data:eData, n:nEmb,
      N:N.clone(), T1:T1.clone(), T2:T2.clone(), base:pos.clone(),
      wind:windVec.clone(), sVar:sVar
    });
  }, 1400);

  // ──────────────────────────────────────────────
  // 12. CONVECTION EMBERS — bright flecks rising in updraft
  // ──────────────────────────────────────────────
  setTimeout(function(){
    var nConv = Math.floor(28 * sVar);
    for(var e=0; e<nConv; e++){
      var eR = (0.0018+Math.random()*0.0018)*sVar;
      var eGeo = new THREE.SphereGeometry(eR, 6, 6);
      var eHue = Math.random();
      var eC = eHue>0.6 ? 0xff8833 : (eHue>0.3 ? 0xffaa44 : 0xffeeaa);
      var eMat = new THREE.MeshBasicMaterial({color:eC, transparent:true, opacity:0.95, depthWrite:false, blending:ADD});
      var eM = new THREE.Mesh(eGeo, eMat);
      var startOff = T1.clone().multiplyScalar((Math.random()-0.5)*0.025).add(T2.clone().multiplyScalar((Math.random()-0.5)*0.025));
      eM.position.copy(pos.clone().add(startOff));
      globeGroup.add(eM);
      explosionsV3.push({
        type:'v3_convect', mesh:eM, t:0, N:N.clone(), base:pos.clone().add(startOff),
        T1:T1.clone(), T2:T2.clone(),
        spd:0.08+Math.random()*0.12,
        spiralR:0.008+Math.random()*0.014,
        spiralPhase:Math.random()*Math.PI*2,
        spiralSpd:0.8+Math.random()*1.2,
        life:3+Math.random()*4
      });
    }
  }, 250);

  // ──────────────────────────────────────────────
  // 13. BALLISTIC DEBRIS — chunks with arcs (slowed)
  // ──────────────────────────────────────────────
  setTimeout(function(){
    var nDebris = Math.floor(48 * sVar);
    for(var p=0;p<nDebris;p++){
      var pS = (0.0018+Math.random()*0.005)*sVar;
      var pGeo = new THREE.SphereGeometry(pS, 5, 5);
      var sh = Math.random();
      var pC = sh>0.85?0xff6633 : sh>0.55?0x884422 : sh>0.25?0x554433 : 0x2a2218;
      var pMat = new THREE.MeshBasicMaterial({color:pC, transparent:true, opacity:0.85, depthWrite:false});
      var pM = new THREE.Mesh(pGeo, pMat);
      pM.position.copy(pos);
      var upMag = 0.0008 + Math.random()*0.004;
      var sideMag = 0.0012 + Math.random()*0.003;
      var vel = N.clone().multiplyScalar(upMag);
      var sideAng = Math.random()*Math.PI*2;
      vel.add(T1.clone().multiplyScalar(Math.cos(sideAng)*sideMag));
      vel.add(T2.clone().multiplyScalar(Math.sin(sideAng)*sideMag));
      globeGroup.add(pM);
      explosionsV3.push({
        type:'v3_debris', mesh:pM, t:0, vel:vel, N:N.clone(),
        glowing: sh>0.7,
        riseT:1.2+Math.random()*2.5,
        drift:new THREE.Vector3((Math.random()-0.5)*0.0004,(Math.random()-0.5)*0.0004,(Math.random()-0.5)*0.0004)
      });

      if(sh > 0.7){
        var hGeo = new THREE.SphereGeometry(pS*2.5, 6, 6);
        var hMat = new THREE.MeshBasicMaterial({color:0xff5522, transparent:true, opacity:0.5, depthWrite:false, blending:ADD});
        var hM = new THREE.Mesh(hGeo, hMat);
        hM.position.copy(pM.position);
        globeGroup.add(hM);
        explosionsV3.push({type:'v3_debris_glow', mesh:hM, target:pM, t:0, life:3.0});
      }
    }
  }, 130);

  // ──────────────────────────────────────────────
  // 14. DRIFTING SMOKE PLUMES — long-lived, wind-driven
  // ──────────────────────────────────────────────
  setTimeout(function(){
    var nPlumes = (yieldClass==='mega'?16 : yieldClass==='large'?12 : yieldClass==='standard'?9 : 6);
    for(var k=0; k<nPlumes; k++){
      var sR = (0.018+Math.random()*0.014)*sVar;
      var sGeo = new THREE.SphereGeometry(sR, 12, 12);
      var sgrey = 0.16 + Math.random()*0.14;
      var sMat = new THREE.MeshBasicMaterial({color:new THREE.Color(sgrey, sgrey*0.95, sgrey*0.85), transparent:true, opacity:0, depthWrite:false});
      var sM = new THREE.Mesh(sGeo, sMat);
      sM.position.copy(pos);
      globeGroup.add(sM);
      explosionsV3.push({
        type:'v3_smoke', mesh:sM, t:0, N:N.clone(), base:pos.clone(),
        T1:T1.clone(), T2:T2.clone(),
        riseSpd:0.022+Math.random()*0.018,
        ang:Math.random()*Math.PI*2,
        driftR:(0.005+Math.random()*0.025),
        peakOpacity:0.45+Math.random()*0.20,
        sVar:sVar,
        delay:k*0.25,
        wind:windVec.clone(),
        capH: yieldCap*sVar,
        life: yieldDuration
      });
    }
  }, 2500);

  // ──────────────────────────────────────────────
  // 15. PERMANENT CRATER — multi-ring scar (deeper for higher yield)
  // ──────────────────────────────────────────────
  var crGeo = new THREE.CircleGeometry(0.062*sVar, 36);
  var crMat = new THREE.MeshBasicMaterial({color:0x180700, transparent:true, opacity:0.55, side:THREE.DoubleSide, depthWrite:false});
  var cr = new THREE.Mesh(crGeo, crMat);
  cr.position.copy(latLngToVec3(lat, lng, globeRadius*1.0004));
  cr.lookAt(cr.position.clone().add(N));
  globeGroup.add(cr);

  var cr2Geo = new THREE.CircleGeometry(0.04*sVar, 32);
  var cr2Mat = new THREE.MeshBasicMaterial({color:0x0a0300, transparent:true, opacity:0.7, side:THREE.DoubleSide, depthWrite:false});
  var cr2 = new THREE.Mesh(cr2Geo, cr2Mat);
  cr2.position.copy(latLngToVec3(lat, lng, globeRadius*1.00045));
  cr2.lookAt(cr2.position.clone().add(N));
  globeGroup.add(cr2);

  var cr3Geo = new THREE.CircleGeometry(0.018*sVar, 24);
  var cr3Mat = new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.85, side:THREE.DoubleSide, depthWrite:false});
  var cr3 = new THREE.Mesh(cr3Geo, cr3Mat);
  cr3.position.copy(latLngToVec3(lat, lng, globeRadius*1.0005));
  cr3.lookAt(cr3.position.clone().add(N));
  globeGroup.add(cr3);

  // Lingering ember glow (additive)
  var emGeo = new THREE.SphereGeometry(0.035*sVar, 14, 14);
  var emMat = new THREE.MeshBasicMaterial({color:0xff3300, transparent:true, opacity:0.35, depthWrite:false, blending:ADD});
  var em = new THREE.Mesh(emGeo, emMat);
  em.position.copy(pos);
  globeGroup.add(em);
  explosionsV3.push({type:'v3_ember', mesh:em, t:0});
}

// ═══════════════════════════════════════════════════════════════
// IMPACT SCORCH — fiery decal that bakes into the earth's surface
// Colors evolve: hot orange/yellow core → cooling red → charred black,
// then stay as a permanent dark scar with subtle ember pulse.
// ═══════════════════════════════════════════════════════════════
function addImpactScorch(lat, lng){
  var pos = latLngToVec3(lat, lng, globeRadius * 1.0006);
  var N = pos.clone().normalize();

  // Per-impact size jitter
  var rOuter = 0.022 + Math.random()*0.020;   // wide molten halo
  var rMid   = rOuter * (0.55 + Math.random()*0.10); // glowing core
  var rInner = rOuter * (0.22 + Math.random()*0.10); // bright center

  // OUTER charring/molten ring — base scar
  var outerGeo = new THREE.CircleGeometry(rOuter, 36);
  var outerMat = new THREE.MeshBasicMaterial({color:0xff5500, transparent:true, opacity:0.95, side:THREE.DoubleSide, depthWrite:false});
  var outerMesh = new THREE.Mesh(outerGeo, outerMat);
  outerMesh.position.copy(pos);
  outerMesh.lookAt(outerMesh.position.clone().add(N));
  globeGroup.add(outerMesh);

  // MID glowing core (additive)
  var midGeo = new THREE.CircleGeometry(rMid, 28);
  var midMat = new THREE.MeshBasicMaterial({color:0xffaa22, transparent:true, opacity:1.0, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending});
  var midMesh = new THREE.Mesh(midGeo, midMat);
  midMesh.position.copy(pos.clone().add(N.clone().multiplyScalar(0.0004)));
  midMesh.lookAt(midMesh.position.clone().add(N));
  globeGroup.add(midMesh);

  // INNER white-hot center (additive)
  var innerGeo = new THREE.CircleGeometry(rInner, 24);
  var innerMat = new THREE.MeshBasicMaterial({color:0xffffee, transparent:true, opacity:1.0, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending});
  var innerMesh = new THREE.Mesh(innerGeo, innerMat);
  innerMesh.position.copy(pos.clone().add(N.clone().multiplyScalar(0.0008)));
  innerMesh.lookAt(innerMesh.position.clone().add(N));
  globeGroup.add(innerMesh);

  impactScorches.push({
    outer: outerMesh, mid: midMesh, inner: innerMesh,
    rOuter: rOuter, t: 0,
    phase: Math.random()*Math.PI*2,
    flicker: 1.5 + Math.random()*2
  });
}

function updateImpactScorches(dt, t){
  impactScorches.forEach(function(s){
    s.t += dt;
    var age = s.t;

    // Phase 1: 0–2s molten/hot — bright orange core, glowing mid, white-hot center
    // Phase 2: 2–6s cooling — fade additive layers, outer ring shifts toward red→dark
    // Phase 3: 6s+ charred — outer ring stays as dark scar with ember flicker
    var fl = 0.5 + 0.5*Math.sin(t*s.flicker + s.phase);

    if(age < 2.0){
      // Hot phase
      s.inner.material.opacity = Math.max(0, 1.0 - age*0.5) * (0.7 + fl*0.3);
      s.mid.material.opacity   = Math.max(0, 1.0 - age*0.35) * (0.6 + fl*0.4);
      s.outer.material.opacity = 0.95;
      s.outer.material.color.setRGB(1.0, 0.35 + fl*0.2, 0.05);
    } else if(age < 6.0){
      // Cooling
      var k = (age - 2.0) / 4.0;
      s.inner.material.opacity = Math.max(0, 0.5*(1-k));
      s.mid.material.opacity   = Math.max(0, 0.5*(1-k)) * (0.6 + fl*0.4);
      s.outer.material.opacity = 0.95 - k*0.15;
      var r = 1.0 - k*0.55;
      var g = (0.35 + fl*0.15) * (1 - k*0.85);
      var b = 0.05 * (1 - k);
      s.outer.material.color.setRGB(r, g, b);
    } else {
      // Charred permanent scar with subtle ember pulse
      s.inner.material.opacity = 0;
      s.mid.material.opacity = 0.05 + fl*0.10;
      s.mid.material.color.setRGB(0.6 + fl*0.3, 0.10 + fl*0.10, 0.0);
      s.outer.material.opacity = 0.80;
      // Charcoal with embers
      s.outer.material.color.setRGB(0.10 + fl*0.08, 0.03, 0.01);
    }
  });
}

function updateExplosionsV3(dt){
  function kill(e){globeGroup.remove(e.mesh);e.mesh.geometry.dispose();e.mesh.material.dispose();e.dead=true;}

  explosionsV3.forEach(function(e){
    e.t += dt;

    // Intercept flash burst (cyan-white)
    if(e.type==='v3_intercept_flash'){
      var s=1+e.t*55; e.mesh.scale.set(s,s,s);
      e.mesh.material.opacity=Math.max(0, 1 - e.t*7);
      if(e.t>0.25) kill(e);
    }
    if(e.type==='v3_intercept_ring'){
      var s=1+e.t*28; e.mesh.scale.set(s,s,s);
      e.mesh.material.opacity=Math.max(0, 0.9 - e.t*4);
      if(e.t>0.4) kill(e);
    }

    // Wilson halo
    if(e.type==='v3_wilson'){
      var s=1+e.t*18; e.mesh.scale.set(s,s,s);
      var op = e.t<0.05 ? e.t*9 : Math.max(0, 0.45 - (e.t-0.05)*1.4);
      e.mesh.material.opacity = op;
      if(e.t>0.5) kill(e);
    }

    // Pinpoint flash
    if(e.type==='v3_flash'){
      var s=1+e.t*70; e.mesh.scale.set(s,s,s);
      e.mesh.material.opacity=Math.max(0,1-e.t*9);
      if(e.t>0.18) kill(e);
    }

    // Glare
    if(e.type==='v3_glare'){
      var s=1+e.t*42; e.mesh.scale.set(s,s,s);
      var f = Math.min(e.t/0.18, 1);
      var r = 0.85 + f*0.15, g = 0.92 + f*0.08, b = 1.0 - f*0.6;
      e.mesh.material.color.setRGB(r,g,b);
      e.mesh.material.opacity=Math.max(0,0.95 - e.t*5.5);
      if(e.t>0.32) kill(e);
    }

    // Halo
    if(e.type==='v3_halo'){
      var s=1+e.t*15; e.mesh.scale.set(s,s,s);
      e.mesh.material.opacity=Math.max(0, 0.7 - e.t*1.6);
      if(e.t>0.55) kill(e);
    }

    // Fireball
    if(e.type==='v3_fireball'){
      var s=1+e.t*5.0*e.sVar; e.mesh.scale.set(s,s,s);
      var rise=Math.min(e.t*0.05,0.07);
      e.mesh.position.copy(e.base.clone().add(e.N.clone().multiplyScalar(0.012+rise)));
      var r,g,b;
      if(e.t<0.12){r=1.0;g=1.0;b=0.95;}
      else if(e.t<0.35){var f=(e.t-0.12)/0.23; r=1.0;g=1.0-f*0.18;b=0.95-f*0.55;}
      else if(e.t<0.7){var f=(e.t-0.35)/0.35; r=1.0;g=0.82-f*0.40;b=0.40-f*0.32;}
      else if(e.t<1.4){var f=(e.t-0.7)/0.7; r=1.0-f*0.30;g=0.42-f*0.28;b=0.08-f*0.04;}
      else{var f=Math.min((e.t-1.4)/1.0,1); r=0.70-f*0.42;g=0.14-f*0.10;b=0.04-f*0.03;}
      e.mesh.material.color.setRGB(Math.max(0,r+e.cShift), Math.max(0,g+(e.gShift||0)), Math.max(0,b+(e.bShift||0)));
      e.mesh.material.opacity=Math.max(0, e.t<0.4 ? 0.95 : 0.95 - (e.t-0.4)*0.45);
      if(e.t>2.5) kill(e);
    }

    // Core
    if(e.type==='v3_core'){
      var s=1+e.t*4*e.sVar; e.mesh.scale.set(s,s,s);
      var rise=Math.min(e.t*0.05,0.07);
      e.mesh.position.copy(e.base.clone().add(e.N.clone().multiplyScalar(0.012+rise)));
      e.mesh.material.opacity=Math.max(0,1-e.t*2.0);
      if(e.t>0.55) kill(e);
    }

    // Plasma
    if(e.type==='v3_plasma'){
      var s=1+e.t*8*e.sVar; e.mesh.scale.set(s,s,s);
      e.mesh.material.opacity=Math.max(0, 0.9 - e.t*4.5);
      var f=Math.min(e.t/0.3,1);
      e.mesh.material.color.setRGB(0.7+f*0.3, 0.85+f*0.15, 1.0);
      if(e.t>0.35) kill(e);
    }

    // Shockwave
    if(e.type==='v3_shockwave'){
      var s=1+e.t*e.spd;
      e.mesh.scale.set(s,s,s);
      var life=2.5+e.idx*0.5;
      var op = (0.85-e.idx*0.20)*(1-e.t/life);
      if(e.idx===0) op *= (1 + Math.sin(e.t*15)*0.1);
      e.mesh.material.opacity=Math.max(0, op);
      if(e.t>life) kill(e);
    }

    // Mach reflection
    if(e.type==='v3_mach'){
      var s=1+e.t*32;
      e.mesh.scale.set(s,s,s);
      e.mesh.material.opacity=Math.max(0, 0.55*(1-e.t/0.9));
      if(e.t>0.9) kill(e);
    }

    // Thermal
    if(e.type==='v3_thermal'){
      var s=1+e.t*5.5*e.sVar; e.mesh.scale.set(s,s,1);
      e.mesh.material.opacity=Math.max(0,0.55*(1-e.t/1.4));
      var f = Math.min(e.t/1.4, 1);
      e.mesh.material.color.setRGB(1.0-f*0.3, 0.33-f*0.20, 0.0);
      if(e.t>1.4) kill(e);
    }

    if(e.type==='v3_thermal_hot'){
      var s=1+e.t*4*e.sVar; e.mesh.scale.set(s,s,1);
      e.mesh.material.opacity=Math.max(0, 0.9*(1-e.t/1.0));
      if(e.t>1.0) kill(e);
    }

    // Ground dust particle burst
    if(e.type==='v3_dust'){
      var posAttr = e.mesh.geometry.attributes.position;
      var arr = posAttr.array;
      for(var i=0; i<e.n; i++){
        var v = e.vel[i];
        v.multiplyScalar(0.985);
        // Gravity toward globe center
        var p = new THREE.Vector3(arr[i*3], arr[i*3+1], arr[i*3+2]);
        var grav = p.clone().normalize().multiplyScalar(-0.0001);
        v.add(grav);
        arr[i*3] += v.x;
        arr[i*3+1] += v.y;
        arr[i*3+2] += v.z;
      }
      posAttr.needsUpdate = true;
      e.mesh.material.opacity = Math.max(0, 0.85 - e.t*0.20);
      if(e.t>4.5) kill(e);
    }

    // Mushroom stem segments
    if(e.type==='v3_stem'){
      var rt=Math.min(e.t/e.riseDur, 1);
      var ez=1-Math.pow(1-rt, 2.8);
      var h=e.tgtH*ez;
      var wob = Math.sin(e.t*1.5 + e.wobblePhase) * e.wobbleAmp * (1-Math.min(rt,1)*0.5);
      var wob2 = Math.cos(e.t*1.2 + e.wobblePhase*1.2) * e.wobbleAmp * 0.7;
      // Twist around vertical (helical column)
      var twistAmt = e.twist * ez;
      var off = e.N.clone().multiplyScalar(h)
        .add(e.T1.clone().multiplyScalar(wob + Math.cos(twistAmt)*0.001))
        .add(e.T2.clone().multiplyScalar(wob2 + Math.sin(twistAmt)*0.001))
        .add(e.T1.clone().multiplyScalar(e.tilt*ez));
      e.mesh.position.copy(e.base.clone().add(off));
      var w = e.widthBase + ez*0.5;
      e.mesh.scale.set(w,w,w);
      e.mesh.material.opacity=Math.max(0, 0.62 - Math.max(0, e.t - e.riseDur*1.3)*0.05);
      if(e.t>1.5 && e.startColor){
        var cool=Math.min((e.t-1.5)/(e.riseDur*1.2), 1)*0.45;
        var sc=e.startColor;
        e.mesh.material.color.setRGB(
          sc.r + (0.55-sc.r)*cool,
          sc.g + (0.5-sc.g)*cool,
          sc.b + (0.45-sc.b)*cool
        );
      }
      if(e.t>e.riseDur*3.5) kill(e);
    }

    // Stem inner glow
    if(e.type==='v3_stem_glow'){
      var rt=Math.min(e.t/e.riseDur, 1);
      var ez=1-Math.pow(1-rt, 2);
      var h = e.glH * (0.3 + ez*0.7);
      e.mesh.position.copy(e.base.clone().add(e.N.clone().multiplyScalar(h)));
      var s = 1 + ez*1.5;
      e.mesh.scale.set(s,s,s);
      var pulse = 1 + Math.sin(e.t*3 + e.idx*1.5)*0.18;
      e.mesh.material.opacity=Math.max(0, 0.55*pulse - Math.max(0,e.t-e.riseDur)*0.1);
      if(e.t>e.riseDur*1.8) kill(e);
    }

    // STEM ASH PARTICLE SYSTEM
    if(e.type==='v3_ashparticles'){
      var posAttr = e.mesh.geometry.attributes.position;
      var arr = posAttr.array;
      var anyAlive = false;
      for(var i=0; i<e.n; i++){
        var d = e.data[i];
        var lt = e.t - d.startDelay;
        if(lt < 0){
          arr[i*3]=e.base.x; arr[i*3+1]=e.base.y; arr[i*3+2]=e.base.z;
          anyAlive = true;
          continue;
        }
        if(lt > d.life){
          // Hide particle
          arr[i*3]=e.base.x; arr[i*3+1]=e.base.y; arr[i*3+2]=e.base.z;
          continue;
        }
        anyAlive = true;
        var h = Math.min(lt * d.riseSpd, d.maxH);
        var phase = d.spiralPhase + lt*d.spiralSpd;
        var r = d.spiralR * (1 + lt*0.15);
        var p = e.base.clone()
          .add(e.N.clone().multiplyScalar(h))
          .add(e.T1.clone().multiplyScalar(Math.cos(phase)*r))
          .add(e.T2.clone().multiplyScalar(Math.sin(phase)*r));
        arr[i*3]=p.x; arr[i*3+1]=p.y; arr[i*3+2]=p.z;
      }
      posAttr.needsUpdate = true;
      e.mesh.material.opacity = Math.max(0, 0.75 - Math.max(0, e.t-6)*0.08);
      if(!anyAlive || e.t > 10) kill(e);
    }

    // Mushroom torus
    if(e.type==='v3_torus'){
      var rt=Math.min(e.t/e.riseDur, 1);
      var ez=1-Math.pow(1-rt, 2);
      var h = e.tgtH * ez;
      var windOff = e.wind.clone().multiplyScalar(e.t*0.5);
      e.mesh.position.copy(e.base.clone().add(e.N.clone().multiplyScalar(h)).add(windOff));
      var s = 0.3 + ez*1.3 + Math.max(0, e.t-e.riseDur)*0.04;
      e.mesh.scale.set(s, s, s*0.5);
      var rotQ = new THREE.Quaternion().setFromAxisAngle(e.N, e.t*0.25);
      var baseQ = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1), e.N);
      e.mesh.quaternion.copy(baseQ).multiply(rotQ);
      e.mesh.material.opacity=Math.max(0, 0.7 - Math.max(0, e.t-e.riseDur*1.3)*0.04);
      if(e.t>e.riseDur*0.5){
        var cool=Math.min((e.t-e.riseDur*0.5)/(e.riseDur*2), 1);
        var v = 0.42 + cool*0.25;
        e.mesh.material.color.setRGB(v, v*0.92, v*0.85);
      }
      if(e.t > e.riseDur*4) kill(e);
    }

    // Crown (top hat brim)
    if(e.type==='v3_crown'){
      var rt=Math.min(e.t/e.riseDur, 1);
      var ez=1-Math.pow(1-rt, 2);
      var h = e.tgtH * ez;
      var windOff = e.wind.clone().multiplyScalar(e.t*0.5);
      e.mesh.position.copy(e.base.clone().add(e.N.clone().multiplyScalar(h)).add(windOff));
      var s = 0.3 + ez*1.5 + Math.max(0, e.t-e.riseDur)*0.05;
      e.mesh.scale.set(s, s*0.35, s); // very oblate (hat brim)
      // Orient brim flat to surface normal
      var brimQ = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), e.N);
      e.mesh.quaternion.copy(brimQ);
      e.mesh.material.opacity=Math.max(0, 0.6 - Math.max(0, e.t-e.riseDur*1.5)*0.04);
      if(e.t>e.riseDur*0.5){
        var cool=Math.min((e.t-e.riseDur*0.5)/(e.riseDur*2.5), 1);
        var v = 0.4 + cool*0.30;
        e.mesh.material.color.setRGB(v, v*0.93, v*0.87);
      }
      if(e.t > e.riseDur*4) kill(e);
    }

    // Cap puffs
    if(e.type==='v3_cap'){
      var rt=Math.min(e.t/e.riseDur, 1);
      var ez=1-Math.pow(1-rt, 2);
      var h=e.tgtH*ez;
      var spread=e.spr*ez;
      var lateralGrow = e.t>e.riseDur ? 1+(e.t-e.riseDur)*0.05 : 1;
      var rotAng = e.ang + e.t * e.rotSpd * e.rotDir;
      var windOff = e.wind.clone().multiplyScalar(e.t*0.5);
      var off=e.N.clone().multiplyScalar(h)
        .add(e.T1.clone().multiplyScalar(Math.cos(rotAng)*spread*lateralGrow))
        .add(e.T2.clone().multiplyScalar(Math.sin(rotAng)*spread*lateralGrow))
        .add(windOff);
      e.mesh.position.copy(e.base.clone().add(off));
      var s=0.3+ez*1.4;
      var flat=0.65-Math.max(0,e.t-e.riseDur)*0.012;
      e.mesh.scale.set(s*lateralGrow, s*Math.max(0.4,flat), s*lateralGrow);
      e.mesh.material.opacity=Math.max(0, 0.55 - Math.max(0,e.t-e.riseDur*1.6)*0.035);
      if(e.t>e.riseDur*0.5 && e.startColor){
        var cool=Math.min((e.t-e.riseDur*0.5)/(e.riseDur*2.2), 1);
        var sc=e.startColor;
        e.mesh.material.color.setRGB(
          sc.r + (0.78-sc.r)*cool,
          sc.g + (0.74-sc.g)*cool,
          sc.b + (0.68-sc.b)*cool
        );
      }
      if(e.t>e.riseDur*4) kill(e);
    }

    // Cap underbelly
    if(e.type==='v3_underbelly'){
      var rt=Math.min(e.t/e.riseDur, 1);
      var ez=1-Math.pow(1-rt, 2);
      var h = e.tgtH*ez;
      var windOff = e.wind.clone().multiplyScalar(e.t*0.5);
      var off = e.N.clone().multiplyScalar(h)
        .add(e.T1.clone().multiplyScalar(Math.cos(e.ang)*e.spr*ez))
        .add(e.T2.clone().multiplyScalar(Math.sin(e.ang)*e.spr*ez))
        .add(windOff);
      e.mesh.position.copy(e.base.clone().add(off));
      var s = 0.4 + ez*1.3;
      e.mesh.scale.set(s, s*0.7, s);
      e.mesh.material.opacity=Math.max(0, 0.6 - Math.max(0, e.t-e.riseDur*1.6)*0.045);
      if(e.t>e.riseDur*4) kill(e);
    }

    // Mushroom heart dome
    if(e.type==='v3_dome'){
      var rt=Math.min(e.t/e.riseDur, 1);
      var ez=1-Math.pow(1-rt, 2);
      var h=e.tgtH*ez;
      e.mesh.position.copy(e.base.clone().add(e.N.clone().multiplyScalar(h)));
      var s=0.2+ez*1.4; e.mesh.scale.set(s,s*0.5,s);
      e.mesh.material.opacity=Math.max(0,0.65 - Math.max(0,e.t-e.riseDur*0.8)*0.08);
      var br=Math.max(0.3, 1 - e.t*0.15);
      e.mesh.material.color.setRGB(br, br*0.45+0.15, br*0.10+0.05);
      if(e.t>e.riseDur*2.5) kill(e);
    }

    // Cap skirt (smoke veil)
    if(e.type==='v3_skirt'){
      var rt=Math.min(e.t/e.riseDur, 1);
      var ez=1-Math.pow(1-rt, 1.8);
      var h = e.tgtH * ez;
      var windOff = e.wind.clone().multiplyScalar(e.t*0.5);
      var off = e.N.clone().multiplyScalar(h)
        .add(e.T1.clone().multiplyScalar(Math.cos(e.ang)*e.spr*ez))
        .add(e.T2.clone().multiplyScalar(Math.sin(e.ang)*e.spr*ez))
        .add(windOff);
      e.mesh.position.copy(e.base.clone().add(off));
      var s = 0.3 + ez*1.5;
      e.mesh.scale.set(s, s*1.2, s); // taller (hangs down)
      e.mesh.material.opacity=Math.max(0, 0.45 - Math.max(0, e.t-e.riseDur*1.5)*0.03);
      if(e.t>e.riseDur*4) kill(e);
    }

    // CAP VORTEX PARTICLES
    if(e.type==='v3_vortexparticles'){
      var posAttr = e.mesh.geometry.attributes.position;
      var arr = posAttr.array;
      var anyAlive = false;
      for(var i=0; i<e.n; i++){
        var d = e.data[i];
        var lt = e.t - d.startDelay;
        if(lt < 0){
          arr[i*3]=e.base.x; arr[i*3+1]=e.base.y; arr[i*3+2]=e.base.z;
          anyAlive = true;
          continue;
        }
        if(lt > d.life){
          arr[i*3]=e.base.x; arr[i*3+1]=e.base.y; arr[i*3+2]=e.base.z;
          continue;
        }
        anyAlive = true;
        var h = Math.min(lt * d.riseSpd, d.targetH);
        var phase = d.spiralPhase + lt*d.spiralSpd;
        var r = d.spiralR * (1 + Math.min(lt*0.15, 0.5));
        var windOff = e.wind.clone().multiplyScalar(lt*0.5);
        var p = e.base.clone()
          .add(e.N.clone().multiplyScalar(h))
          .add(e.T1.clone().multiplyScalar(Math.cos(phase)*r))
          .add(e.T2.clone().multiplyScalar(Math.sin(phase)*r))
          .add(windOff);
        arr[i*3]=p.x; arr[i*3+1]=p.y; arr[i*3+2]=p.z;
      }
      posAttr.needsUpdate = true;
      e.mesh.material.opacity = Math.max(0, 0.7 - Math.max(0, e.t-10)*0.05);
      if(!anyAlive || e.t > 18) kill(e);
    }

    // EMBER RAIN PARTICLES
    if(e.type==='v3_emberparticles'){
      var posAttr = e.mesh.geometry.attributes.position;
      var arr = posAttr.array;
      var anyAlive = false;
      for(var i=0; i<e.n; i++){
        var d = e.data[i];
        var lt = e.t - d.spawnAt;
        if(lt < 0){
          arr[i*3]=e.base.x; arr[i*3+1]=e.base.y; arr[i*3+2]=e.base.z;
          anyAlive = true;
          continue;
        }
        if(lt > d.life){
          arr[i*3]=e.base.x; arr[i*3+1]=e.base.y; arr[i*3+2]=e.base.z;
          continue;
        }
        anyAlive = true;
        // Start at cap underbelly, fall toward globe, drift with wind
        var fallH = d.spawnH - lt*d.fallSpd;
        var radial = d.spawnR * (1 + lt*0.1);
        var windOff = e.wind.clone().multiplyScalar(lt*0.3);
        var p = e.base.clone()
          .add(e.N.clone().multiplyScalar(Math.max(0, fallH)))
          .add(e.T1.clone().multiplyScalar(Math.cos(d.spawnAng)*radial))
          .add(e.T2.clone().multiplyScalar(Math.sin(d.spawnAng)*radial))
          .add(windOff);
        arr[i*3]=p.x; arr[i*3+1]=p.y; arr[i*3+2]=p.z;
      }
      posAttr.needsUpdate = true;
      e.mesh.material.opacity = Math.max(0, 0.9 - Math.max(0, e.t-12)*0.08);
      if(!anyAlive || e.t > 20) kill(e);
    }

    // Convection embers
    if(e.type==='v3_convect'){
      var phase = e.spiralPhase + e.t*e.spiralSpd;
      var rise = e.t * e.spd;
      var radial = e.spiralR * (1 + e.t*0.3);
      var off = e.N.clone().multiplyScalar(rise)
        .add(e.T1.clone().multiplyScalar(Math.cos(phase)*radial))
        .add(e.T2.clone().multiplyScalar(Math.sin(phase)*radial));
      e.mesh.position.copy(e.base.clone().add(off));
      var pulse = 0.85 + Math.sin(e.t*8)*0.15;
      e.mesh.material.opacity=Math.max(0, pulse * Math.max(0, 1 - e.t/e.life));
      if(e.t>e.life) kill(e);
    }

    // Ballistic debris
    if(e.type==='v3_debris'){
      if(e.t<e.riseT){
        e.mesh.position.add(e.vel);
        var grav0=e.mesh.position.clone().normalize().multiplyScalar(-0.000020);
        e.vel.add(grav0);
        e.vel.multiplyScalar(0.994);
      } else {
        var grav=e.mesh.position.clone().normalize().multiplyScalar(-0.00005);
        e.vel.add(grav); e.vel.add(e.drift); e.vel.multiplyScalar(0.996);
        e.mesh.position.add(e.vel);
      }
      e.mesh.material.opacity=Math.max(0, 0.85 - e.t*0.10);
      var s=Math.max(0.3, 1 - e.t*0.06); e.mesh.scale.set(s,s,s);
      if(e.glowing && e.t > 0.3){
        var cool = Math.min((e.t-0.3)/2.5, 1);
        e.mesh.material.color.setRGB(1.0-cool*0.6, 0.4-cool*0.25, 0.2-cool*0.15);
      }
      if(e.t>8) kill(e);
    }

    // Glowing debris halo
    if(e.type==='v3_debris_glow'){
      if(e.target && !e.target.parent){ kill(e); return; }
      if(e.target) e.mesh.position.copy(e.target.position);
      var s = 1 + e.t*0.2; e.mesh.scale.set(s,s,s);
      e.mesh.material.opacity=Math.max(0, 0.5*(1 - e.t/e.life));
      if(e.t>e.life) kill(e);
    }

    // Drifting smoke plumes
    if(e.type==='v3_smoke'){
      var dt2 = e.t - e.delay;
      if(dt2 < 0){ e.mesh.material.opacity = 0; return; }
      var rise = dt2 * e.riseSpd;
      var radial = e.driftR * Math.min(dt2*0.25, 1);
      var windOff = e.wind.clone().multiplyScalar(dt2*0.6);
      var off = e.N.clone().multiplyScalar(e.capH*0.85 + rise)
        .add(e.T1.clone().multiplyScalar(Math.cos(e.ang + dt2*0.1)*radial))
        .add(e.T2.clone().multiplyScalar(Math.sin(e.ang + dt2*0.1)*radial))
        .add(windOff);
      e.mesh.position.copy(e.base.clone().add(off));
      var s = 1 + dt2*0.7;
      e.mesh.scale.set(s,s,s);
      var fadeIn = Math.min(dt2/1.5, 1);
      var fadeOut = Math.max(0, 1 - Math.max(0, dt2-(e.life*0.4))/(e.life*0.6));
      e.mesh.material.opacity = e.peakOpacity * fadeIn * fadeOut;
      if(dt2 > e.life) kill(e);
    }

    // Lingering ember
    if(e.type==='v3_ember'){
      var pulse=0.3+Math.sin(e.t*1.5)*0.12;
      e.mesh.material.opacity=Math.max(0, pulse - e.t*0.012);
      var s=1+e.t*0.06; e.mesh.scale.set(s,s,s);
      if(e.t>20) kill(e);
    }
  });
  explosionsV3=explosionsV3.filter(function(e){return !e.dead;});
}

// ═══════════════════════════════════════════════════════════════
// V4 EXPLOSION SYSTEM — shader-driven, arcade-dramatic
// Step A: shader fireball (vertex displacement + fragment FBM blackbody)
// ═══════════════════════════════════════════════════════════════

// Shared GLSL: 3D simplex noise + FBM (Ashima/IanMcEwan, public domain)
var V4_GLSL_NOISE = [
  'vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}',
  'vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}',
  'vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}',
  'vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}',
  'float snoise(vec3 v){',
  '  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);',
  '  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);',
  '  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g;',
  '  vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);',
  '  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;',
  '  i=mod289(i);',
  '  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));',
  '  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;',
  '  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z);',
  '  vec4 y_=floor(j-7.0*x_); vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy;',
  '  vec4 h=1.0-abs(x)-abs(y); vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);',
  '  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));',
  '  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;',
  '  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);',
  '  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));',
  '  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;',
  '  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;',
  '  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));',
  '}',
  'float fbm(vec3 p){',
  '  float v=0.0; float a=0.5; vec3 q=p;',
  '  for(int i=0;i<5;i++){ v+=a*snoise(q); q*=2.03; a*=0.5; }',
  '  return v;',
  '}'
].join('\n');

// ───────────────────────────────────────────────
// Puff material — simple smooth shader for cluster puffs.
// No vertex displacement: lumpy mushroom silhouette comes from many
// overlapping spheres (the "puff cluster"), not from per-vertex math.
// Top/bottom shading via world-up dot, soft Fresnel silhouette alpha.
// FrontSide, NormalBlending, transparent, depthWrite false.
// ───────────────────────────────────────────────
function makeV4PuffMaterial(opts){
  opts = opts || {};
  var topCol    = opts.uTop    || new THREE.Vector3(0.42, 0.28, 0.22);
  var underCol  = opts.uUnder  || new THREE.Vector3(1.00, 0.48, 0.16);
  var shadowCol = opts.uShadow || new THREE.Vector3(0.10, 0.06, 0.05);
  var alphaMul  = opts.uAlphaMul != null ? opts.uAlphaMul : 1.0;
  var rimPow    = opts.uRimPow   != null ? opts.uRimPow   : 1.6;
  var up        = opts.uUp || new THREE.Vector3(0,1,0);

  var vs = [
    'varying vec3 vWorldN;',
    'varying vec3 vWorldP;',
    'void main(){',
    '  vec4 worldP = modelMatrix * vec4(position, 1.0);',
    '  vWorldP = worldP.xyz;',
    '  vWorldN = normalize(mat3(modelMatrix) * normal);',
    '  gl_Position = projectionMatrix * viewMatrix * worldP;',
    '}'
  ].join('\n');

  var fs = [
    'uniform vec3 uUp;',
    'uniform vec3 uTop;',
    'uniform vec3 uUnder;',
    'uniform vec3 uShadow;',
    'uniform float uAlphaMul;',
    'uniform float uRimPow;',
    'varying vec3 vWorldN;',
    'varying vec3 vWorldP;',
    'void main(){',
    '  vec3 N = normalize(vWorldN);',
    '  // Top vs bottom shading along world-up',
    '  float topFrac = smoothstep(-0.45, 0.55, dot(N, normalize(uUp)));',
    '  vec3 col = mix(uUnder, uTop, topFrac);',
    '  // Lift shadow color so undersides are not muddy',
    '  col = mix(uShadow, col, 0.55 + 0.45 * topFrac);',
    '  // Soft silhouette: dense interior, thins at silhouette',
    '  vec3 viewDir = normalize(cameraPosition - vWorldP);',
    '  float facing = max(0.0, dot(N, viewDir));',
    '  float alpha = pow(facing, uRimPow);',
    '  alpha = mix(0.30, 1.0, alpha);',
    '  alpha *= uAlphaMul;',
    '  gl_FragColor = vec4(col, alpha);',
    '}'
  ].join('\n');

  return new THREE.ShaderMaterial({
    uniforms: {
      uUp:       { value: up.clone ? up.clone() : new THREE.Vector3(up.x, up.y, up.z) },
      uTop:      { value: topCol.clone ? topCol.clone() : new THREE.Vector3(topCol.x, topCol.y, topCol.z) },
      uUnder:    { value: underCol.clone ? underCol.clone() : new THREE.Vector3(underCol.x, underCol.y, underCol.z) },
      uShadow:   { value: shadowCol.clone ? shadowCol.clone() : new THREE.Vector3(shadowCol.x, shadowCol.y, shadowCol.z) },
      uAlphaMul: { value: alphaMul },
      uRimPow:   { value: rimPow }
    },
    vertexShader: vs,
    fragmentShader: fs,
    transparent: true,
    depthWrite: false,
    side: THREE.FrontSide,
    blending: THREE.NormalBlending
  });
}

// ───────────────────────────────────────────────
// Shared unit puff geometry — single SphereGeometry reused by every puff
// across every explosion. Lazily created. NEVER disposed by per-cluster
// teardown (we only dispose the per-puff materials).
// ───────────────────────────────────────────────
var V4_PUFF_GEO = null;
function getV4PuffGeometry(){
  if(!V4_PUFF_GEO){
    V4_PUFF_GEO = new THREE.SphereGeometry(0.5, 22, 14);
  }
  return V4_PUFF_GEO;
}

// ───────────────────────────────────────────────
// buildV4PuffCluster — given an arrangement of puff specs
// {x, y, z, s (scale), j (jitter amount)} build a THREE.Group of puffs
// with random positional jitter. Returns {group, puffs} where each puff
// records {mesh, baseScale, phase} for downstream animation.
// ───────────────────────────────────────────────
function buildV4PuffCluster(arrangement, opts){
  opts = opts || {};
  var group = new THREE.Group();
  var puffs = [];
  var geo = getV4PuffGeometry();
  for(var i = 0; i < arrangement.length; i++){
    var spec = arrangement[i];
    var mat = makeV4PuffMaterial(opts);
    var mesh = new THREE.Mesh(geo, mat);
    var jitter = spec.j || 0;
    mesh.position.set(
      spec.x + (Math.random() - 0.5) * jitter,
      spec.y + (Math.random() - 0.5) * jitter,
      spec.z + (Math.random() - 0.5) * jitter
    );
    var scl = spec.s * (0.92 + Math.random() * 0.16);
    mesh.scale.setScalar(scl);
    group.add(mesh);
    puffs.push({ mesh: mesh, baseScale: scl, phase: Math.random() * Math.PI * 2 });
  }
  return { group: group, puffs: puffs };
}

// ───────────────────────────────────────────────
// Arrangement builders — return arrays of {x,y,z,s,j} puff specs.
// All coordinates are in unit-cluster space (cluster lives in a ~1×1×1 box,
// then is scaled per explosion).
// ───────────────────────────────────────────────
function makeV4CapArrangement(){
  var a = [];
  // Top crown puff
  a.push({ x: 0, y: 0.55, z: 0, s: 1.4, j: 0.06 });
  // Upper ring (7 puffs, radius 0.50, y=0.30)
  var n1 = 7;
  for(var i = 0; i < n1; i++){
    var t = (i / n1) * Math.PI * 2;
    a.push({ x: Math.cos(t) * 0.50, y: 0.30, z: Math.sin(t) * 0.50, s: 1.0, j: 0.07 });
  }
  // Middle ring (9 puffs, radius 0.85, y=-0.05) — widest belly
  var n2 = 9;
  for(var i = 0; i < n2; i++){
    var t = (i / n2) * Math.PI * 2 + 0.2;
    a.push({ x: Math.cos(t) * 0.85, y: -0.05, z: Math.sin(t) * 0.85, s: 1.05, j: 0.08 });
  }
  // Underbelly ring (6 puffs, radius 0.55, y=-0.40)
  var n3 = 6;
  for(var i = 0; i < n3; i++){
    var t = (i / n3) * Math.PI * 2 + 0.45;
    a.push({ x: Math.cos(t) * 0.55, y: -0.40, z: Math.sin(t) * 0.55, s: 0.85, j: 0.06 });
  }
  return a;
}

function makeV4StemArrangement(){
  var a = [];
  // 5 vertical levels from y=-0.5 to y=+0.4, 4 puffs around the axis.
  var levels = 5;
  for(var lv = 0; lv < levels; lv++){
    var f = lv / (levels - 1); // 0..1
    var y = -0.5 + f * 0.9;
    var r = 0.30 + f * 0.15; // 0.30..0.45 (slight flare upward)
    var s = 0.85 - f * 0.10; // slightly smaller toward top
    var rotOff = lv * 0.4;   // phase-rotate each level for organic variation
    for(var i = 0; i < 4; i++){
      var t = (i / 4) * Math.PI * 2 + rotOff;
      a.push({ x: Math.cos(t) * r, y: y, z: Math.sin(t) * r, s: s, j: 0.05 });
    }
  }
  return a;
}

function makeV4SplashArrangement(){
  var a = [];
  // Inner ring of 6 puffs, r=0.45
  for(var i = 0; i < 6; i++){
    var t = (i / 6) * Math.PI * 2;
    a.push({ x: Math.cos(t) * 0.45, y: 0.05, z: Math.sin(t) * 0.45, s: 0.85, j: 0.05 });
  }
  // Outer ring of 8 puffs, r=0.85
  for(var i = 0; i < 8; i++){
    var t = (i / 8) * Math.PI * 2 + 0.3;
    a.push({ x: Math.cos(t) * 0.85, y: 0.05, z: Math.sin(t) * 0.85, s: 0.95, j: 0.06 });
  }
  return a;
}

function makeV4DustRingArrangement(){
  var a = [];
  // Sparser flat ring of 12 puffs at r=1.0, y=0
  for(var i = 0; i < 12; i++){
    var t = (i / 12) * Math.PI * 2;
    a.push({ x: Math.cos(t) * 1.0, y: 0, z: Math.sin(t) * 1.0, s: 0.80, j: 0.08 });
  }
  return a;
}

// ───────────────────────────────────────────────
// Earth crust ejecta — chunks of ground lifted by the blast.
// STRUCTURE NOTE:
//   Each chunk is a per-frame integrated rigid body with two modes:
//     - 'ballistic': gravity pulls toward planet center, chunks arc and fall back.
//     - 'escape':    gravity disabled, optional outward push, chunks drift to space.
//   To later flip chunks (or all of them) to escape mode, set chunk.mode='escape'
//   and chunk.gravStrength=0; or call escapeAllV4Ejecta() to flip every live chunk.
// ───────────────────────────────────────────────
var V4_CRUST_GEOMETRIES = null;
function getV4CrustGeometries(){
  if(!V4_CRUST_GEOMETRIES){
    V4_CRUST_GEOMETRIES = [
      new THREE.BoxGeometry(1, 0.55, 1),
      new THREE.BoxGeometry(0.7, 1.1, 0.6),
      new THREE.TetrahedronGeometry(1, 0),
      new THREE.OctahedronGeometry(0.9, 0),
      new THREE.DodecahedronGeometry(0.75, 0),
      new THREE.IcosahedronGeometry(0.85, 0)
    ];
  }
  return V4_CRUST_GEOMETRIES;
}

// Earth-toned palette for surface chunks
var V4_CRUST_PALETTE = [
  0x6b4a2b, 0x8a6240, 0x4a3220, 0x9a8a70,  // rock / dirt / sand
  0x3a5a2c, 0x4d6e3a, 0x2d4a22,            // vegetation
  0x2a4d6a, 0x1a3a55, 0x224060,            // ocean / lake
  0x55504a, 0x3a352f, 0x2a2620             // ash / scorched
];

// ───────────────────────────────────────────────
// Earth-skin chunk — small spherical-cap patch UV-mapped to the live earth
// texture at the impact lat/lng. The chunk *looks like the actual ground
// from that location* because its UVs sample the same Blue Marble bitmap
// the globe is using.
//
// pos        — impact position in globe-local space (length ≈ globeRadius)
// angSize    — angular half-size of the patch in radians (typical ~0.04)
// returns    — { mesh, geometry, material } (caller disposes geo/mat on death)
// ───────────────────────────────────────────────
function createEarthSkinChunk(pos, angSize){
  // Patch geometry: a spherical cap, oriented along world +Y, at radius
  // globeRadius. We then rotate it into place via quaternion below.
  // PhiStart = 0 means the cap is centered on +Y; thetaLength = 2PI gives
  // a full disc; phiLength = angSize gives the cap half-angle.
  var geo = new THREE.SphereGeometry(
    globeRadius,
    20, 16,            // segments
    0, Math.PI * 2,    // theta full
    0, angSize         // phi (cap half-angle)
  );

  // Convert pos to lat/lng so we can rewrite UVs to sample the texture
  // at that exact spot on the bitmap.
  var p = pos.clone().normalize();
  var lat = Math.asin(p.y) * 180 / Math.PI;
  var lng = Math.atan2(-p.x, p.z) * 180 / Math.PI - 180;
  if(lng < -180) lng += 360;
  if(lng >  180) lng -= 360;

  // The Blue Marble texture is an equirectangular projection: x=lng, y=lat.
  // For each vertex of the cap, compute its actual lat/lng once it's
  // rotated to the impact site, and map that to UV space.
  var quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), p);
  var posAttr = geo.attributes.position;
  var uvAttr  = geo.attributes.uv;
  var v = new THREE.Vector3();
  for(var i = 0; i < posAttr.count; i++){
    v.fromBufferAttribute(posAttr, i);
    v.applyQuaternion(quat);     // vertex in globe-local space
    var vn = v.clone().normalize();
    var vLat = Math.asin(vn.y) * 180 / Math.PI;
    var vLng = Math.atan2(-vn.x, vn.z) * 180 / Math.PI - 180;
    if(vLng < -180) vLng += 360;
    if(vLng >  180) vLng -= 360;
    var u = (vLng + 180) / 360;  // 0..1
    var w = (vLat +  90) / 180;  // 0..1 (south=0, north=1)
    uvAttr.setXY(i, u, w);
  }
  uvAttr.needsUpdate = true;
  // Bake the rotation so vertices sit on the impact site in world space,
  // then re-center the geometry to origin so mesh.position drives the
  // chunk's world location without double-offset.
  geo.applyQuaternion(quat);
  // Compute actual centroid of rotated geometry
  var posAttr2 = geo.attributes.position;
  var cx = 0, cy = 0, cz = 0;
  for(var ci = 0; ci < posAttr2.count; ci++){
    cx += posAttr2.getX(ci);
    cy += posAttr2.getY(ci);
    cz += posAttr2.getZ(ci);
  }
  cx /= posAttr2.count; cy /= posAttr2.count; cz /= posAttr2.count;
  geo.translate(-cx, -cy, -cz);
  geo.computeVertexNormals();

  var mat = earthTexture
    ? new THREE.MeshLambertMaterial({
        map: earthTexture,
        side: THREE.DoubleSide,
        emissive: new THREE.Color(0x1a0a02),
        emissiveIntensity: 0.4
      })
    : new THREE.MeshLambertMaterial({
        color: 0x6b4a2b,
        side: THREE.DoubleSide
      });
  mat.transparent = true;
  mat.opacity = 1.0;

  var mesh = new THREE.Mesh(geo, mat);
  return { mesh: mesh, geometry: geo, material: mat };
}

// ───────────────────────────────────────────────
// Persistent crater decal — a dark scorched patch left on the globe surface
// after the explosion fades. Decals are children of globeGroup so they rotate
// with the planet and accumulate across turns. We cap the live decal count to
// avoid unbounded growth (oldest decals are removed when over the cap).
// ───────────────────────────────────────────────
var V4_CRATER_DECALS = [];
var V4_CRATER_DECAL_LIMIT = 200;

function spawnCraterDecal(pos, N, sVar, yieldScale){
  // Decal sits flush on the surface (slightly above to avoid z-fighting)
  var angSize = (0.018 + 0.022 * yieldScale) * (0.85 + Math.random() * 0.30);
  var R = globeRadius * 1.0008;
  var p = pos.clone().normalize();
  var quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), p);

  // Outer shadow halo (soft, wider)
  var haloGeo = new THREE.SphereGeometry(R, 28, 18, 0, Math.PI*2, 0, angSize * 1.6);
  haloGeo.applyQuaternion(quat);
  var haloMat = new THREE.MeshBasicMaterial({
    color: 0x140804,
    transparent: true,
    opacity: 0.35,
    depthWrite: false,
    side: THREE.FrontSide
  });
  var halo = new THREE.Mesh(haloGeo, haloMat);
  halo.renderOrder = 0;
  globeGroup.add(halo);

  // Inner dark crater (tighter, opaque-ish)
  var coreGeo = new THREE.SphereGeometry(R * 1.0002, 24, 14, 0, Math.PI*2, 0, angSize);
  coreGeo.applyQuaternion(quat);
  var coreMat = new THREE.MeshBasicMaterial({
    color: 0x080302,
    transparent: true,
    opacity: 0.78,
    depthWrite: false,
    side: THREE.FrontSide
  });
  var core = new THREE.Mesh(coreGeo, coreMat);
  core.renderOrder = 1;
  globeGroup.add(core);

  // Hot rim — dim red glow that fades during the first few seconds
  var rimGeo = new THREE.SphereGeometry(R * 1.0004, 24, 14, 0, Math.PI*2, 0, angSize * 0.7);
  rimGeo.applyQuaternion(quat);
  var rimMat = new THREE.MeshBasicMaterial({
    color: 0xff5018,
    transparent: true,
    opacity: 0.55,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.FrontSide
  });
  var rim = new THREE.Mesh(rimGeo, rimMat);
  rim.renderOrder = 2;
  globeGroup.add(rim);

  V4_CRATER_DECALS.push({ halo: halo, core: core, rim: rim, t: 0 });

  // Cap total decals — when over limit, remove and dispose oldest
  while(V4_CRATER_DECALS.length > V4_CRATER_DECAL_LIMIT){
    var old = V4_CRATER_DECALS.shift();
    [old.halo, old.core, old.rim].forEach(function(m){
      if(!m) return;
      globeGroup.remove(m);
      if(m.geometry) m.geometry.dispose();
      if(m.material) m.material.dispose();
    });
  }
}

function updateCraterDecals(dt){
  for(var i = 0; i < V4_CRATER_DECALS.length; i++){
    var d = V4_CRATER_DECALS[i];
    d.t += dt;
    // Rim glow fades over the first ~6 seconds
    if(d.rim){
      var rimOp = Math.max(0, 0.55 * Math.exp(-d.t * 0.5));
      d.rim.material.opacity = rimOp;
      if(rimOp <= 0.01){
        globeGroup.remove(d.rim);
        d.rim.geometry.dispose();
        d.rim.material.dispose();
        d.rim = null;
      }
    }
  }
}

function spawnV4Ejecta(pos, N, sVar, yieldScale){
  var T1 = new THREE.Vector3(1,0,0).cross(N).normalize();
  if(T1.lengthSq() < 0.01) T1 = new THREE.Vector3(0,1,0).cross(N).normalize();
  var T2 = N.clone().cross(T1).normalize();

  // Count scales with yield: ~22 (tiny) → ~70 (mega)
  var nChunks = Math.floor(18 + yieldScale * 24);

  var geos = getV4CrustGeometries();
  var palette = V4_CRUST_PALETTE;

  // Spawn radius = roughly the ground-splash extent, so chunks lift from the impact zone
  var spawnRMax = 0.45 * sVar;

  for(var i = 0; i < nChunks; i++){
    var ang = Math.random() * Math.PI * 2;
    var radial = Math.pow(Math.random(), 0.6) * spawnRMax; // bias toward center
    var spawnOff = T1.clone().multiplyScalar(Math.cos(ang) * radial)
                  .add(T2.clone().multiplyScalar(Math.sin(ang) * radial));
    var spawnPos = pos.clone().add(spawnOff).add(N.clone().multiplyScalar(0.003));

    var radialFrac = radial / (spawnRMax + 1e-6);

    // Velocity: outward + upward cone. Center chunks go more vertical, edge chunks more lateral.
    var upMag   = (0.04 + Math.random() * 0.10) * (0.6 + yieldScale*0.5) * (1.15 - radialFrac*0.45);
    var sideMag = (0.02 + Math.random() * 0.06) * (0.6 + yieldScale*0.5);
    var sideAng = Math.random() * Math.PI * 2;
    var vel = N.clone().multiplyScalar(upMag);
    vel.add(T1.clone().multiplyScalar(Math.cos(sideAng) * sideMag));
    vel.add(T2.clone().multiplyScalar(Math.sin(sideAng) * sideMag));
    // Outer chunks get an extra outward kick so the crater spreads
    if(radialFrac > 0.25){
      var outDir = spawnOff.clone().normalize();
      vel.add(outDir.multiplyScalar(sideMag * radialFrac * 1.2));
    }

    var geo = geos[Math.floor(Math.random() * geos.length)];
    var size = (0.004 + Math.random() * 0.011) * sVar * (1.0 + yieldScale*0.25);
    var col  = palette[Math.floor(Math.random() * palette.length)];
    var mat  = new THREE.MeshLambertMaterial({color: col, transparent: true, opacity: 1});
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(spawnPos);
    mesh.scale.setScalar(size);
    mesh.rotation.set(Math.random()*Math.PI*2, Math.random()*Math.PI*2, Math.random()*Math.PI*2);
    mesh.renderOrder = 4;
    globeGroup.add(mesh);

    // ~22% of chunks are "hot" — added orange glow sphere riding along
    var isHot = Math.random() < 0.22;
    var glowMesh = null;
    if(isHot){
      var glowGeo = new THREE.SphereGeometry(size * 1.8, 8, 8);
      var glowMat = new THREE.MeshBasicMaterial({
        color: 0xff5522, transparent: true, opacity: 0.55,
        depthWrite: false, blending: THREE.AdditiveBlending
      });
      glowMesh = new THREE.Mesh(glowGeo, glowMat);
      glowMesh.position.copy(spawnPos);
      glowMesh.renderOrder = 4;
      globeGroup.add(glowMesh);
    }

    explosionsV4.push({
      type: 'v4_crust',
      mesh: mesh,
      glowMesh: glowMesh,
      isHot: isHot,
      pos: spawnPos.clone(),
      vel: vel,
      angVel: new THREE.Vector3(
        (Math.random()-0.5)*5,
        (Math.random()-0.5)*5,
        (Math.random()-0.5)*5
      ),
      // ── MODE STRUCTURE — easy to flip later ──
      mode: 'ballistic',           // 'ballistic' | 'escape'
      escapeAt: Infinity,          // time at which to flip to escape mode
      gravStrength: 0.18 + Math.random()*0.06,  // accel toward planet center
      escapeOutward: 0.05,         // outward accel applied in escape mode
      // ── lifecycle ──
      t: 0,
      dur: 4.5 + Math.random()*2.5,
      fadeIn: 0.8,                 // fade-out over last fadeIn seconds
      sharedGeo: true              // don't dispose shared geometry on kill
    });
  }

  // ── EARTH-SKIN CHUNKS — patches of the actual planet surface lifting off ──
  // Fewer + bigger than the primitive debris. UV-sampled from the live earth
  // texture so they look like real ground from the impact location.
  var nSkin = 6 + Math.floor(yieldScale * 6); // 6 → 12
  var skinAngBase = 0.12 + 0.08 * yieldScale; // patch half-angle in radians (~7-12 degrees)
  for(var sj = 0; sj < nSkin; sj++){
    var sang = Math.random() * Math.PI * 2;
    var sradial = Math.pow(Math.random(), 0.5) * spawnRMax * 0.8;
    var soff = T1.clone().multiplyScalar(Math.cos(sang) * sradial)
              .add(T2.clone().multiplyScalar(Math.sin(sang) * sradial));
    var spawnPos2 = pos.clone().add(soff).add(N.clone().multiplyScalar(0.002));
    var sradialFrac = sradial / (spawnRMax + 1e-6);

    // Skin patches lift more vertically than primitives — they ARE the ground
    var upMag2   = (0.15 + Math.random() * 0.20) * (0.8 + yieldScale*0.6) * (1.2 - sradialFrac*0.4);
    var sideMag2 = (0.06 + Math.random() * 0.10) * (0.7 + yieldScale*0.5);
    var sideAng2 = Math.random() * Math.PI * 2;
    var vel2 = N.clone().multiplyScalar(upMag2);
    vel2.add(T1.clone().multiplyScalar(Math.cos(sideAng2) * sideMag2));
    vel2.add(T2.clone().multiplyScalar(Math.sin(sideAng2) * sideMag2));
    if(sradialFrac > 0.2){
      var outDir2 = soff.clone().normalize();
      vel2.add(outDir2.multiplyScalar(sideMag2 * sradialFrac * 1.0));
    }

    // Position the patch where it would naturally sit on the globe — at
    // the same lat/lng as spawnPos2, on the surface. The helper rotates
    // the geometry into that spot.
    // Lift the spawn slightly above the surface so the ground-hit check
    // doesn't fire on frame 1.
    var skinPos = spawnPos2.clone().normalize().multiplyScalar(globeRadius * 1.005);
    var angSize = skinAngBase * (0.7 + Math.random() * 0.7);
    var skin = createEarthSkinChunk(skinPos, angSize);
    skin.mesh.renderOrder = 4;
    globeGroup.add(skin.mesh);

    explosionsV4.push({
      type: 'v4_crust',
      mesh: skin.mesh,
      glowMesh: null,
      isHot: false,
      pos: skinPos.clone(),
      vel: vel2,
      angVel: new THREE.Vector3(
        (Math.random()-0.5)*3.5,
        (Math.random()-0.5)*3.5,
        (Math.random()-0.5)*3.5
      ),
      mode: 'ballistic',
      escapeAt: Infinity,
      gravStrength: 0.08 + Math.random()*0.04,
      escapeOutward: 0.06,
      t: 0,
      dur: 6.0 + Math.random()*3.0,
      fadeIn: 1.5,
      sharedGeo: false,            // unique per-chunk geometry, dispose on kill
      isEarthSkin: true
    });
  }
}

// Flip every live ejecta chunk to escape mode (call this when you want
// the planet's debris to drift out into space).
function escapeAllV4Ejecta(opts){
  opts = opts || {};
  var outward = opts.outward != null ? opts.outward : 0.06;
  for(var i=0; i<explosionsV4.length; i++){
    var e = explosionsV4[i];
    if(e.type === 'v4_crust' && e.mode === 'ballistic'){
      e.mode = 'escape';
      e.gravStrength = 0;
      e.escapeOutward = outward;
      // Add a small immediate outward kick so the transition reads
      var n = e.pos.clone().normalize();
      e.vel.add(n.multiplyScalar(outward * 0.5));
      // Extend lifetime a bit so we can see them go
      e.dur = e.t + 6 + Math.random()*3;
    }
  }
}

// ───────────────────────────────────────────────
// triggerExplosionV4 — full mushroom cloud
// flash → bright core → stem rises → cap inflates → ground splash → linger
// ───────────────────────────────────────────────
function triggerExplosionV4(lat, lng){
  var pos = latLngToVec3(lat, lng, globeRadius * 1.003);
  var N = pos.clone().normalize();

  // Build a quaternion that maps Y-up → N (impact normal)
  var quatN = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), N);

  // Yield class
  var yRoll = Math.random();
  var yieldScale, yieldDuration;
  if(yRoll < 0.35){       yieldScale=0.65; yieldDuration=5.0; }
  else if(yRoll < 0.65){  yieldScale=0.90; yieldDuration=6.0; }
  else if(yRoll < 0.85){  yieldScale=1.20; yieldDuration=7.5; }
  else if(yRoll < 0.95){  yieldScale=1.65; yieldDuration=9.0; }
  else{                   yieldScale=2.20; yieldDuration=11.0; }

  // Big cinematic scale — explosion is ~10–20% of globe diameter
  var sVar = 0.11 * yieldScale * (0.88 + Math.random()*0.24);
  var seed = Math.random();

  var capRadius   = 0.65 * sVar;
  var capAltitude = 1.50 * sVar;     // distance from impact to cap CENTER
  var stemLen     = capAltitude;     // stem touches impact and cap
  var stemRadius  = 0.18 * sVar;
  var splashRad   = 1.10 * sVar;

  // ── Bright initial flash (additive) ──
  var flGeo = new THREE.SphereGeometry(0.06*sVar, 24, 24);
  var flMat = new THREE.MeshBasicMaterial({color:0xfff5dc, transparent:true, opacity:1, depthWrite:false, blending:THREE.AdditiveBlending});
  var fl = new THREE.Mesh(flGeo, flMat); fl.position.copy(pos);
  fl.renderOrder = 10;
  globeGroup.add(fl);
  explosionsV4.push({type:'v4_flash', mesh:fl, t:0, dur:0.45, sVar:sVar});

  // ── Brief incandescent core (visible inside the stem base early on) ──
  var coGeo = new THREE.SphereGeometry(0.08*sVar, 24, 24);
  var coMat = new THREE.MeshBasicMaterial({color:0xffaa55, transparent:true, opacity:0.95, depthWrite:false, blending:THREE.AdditiveBlending});
  var co = new THREE.Mesh(coGeo, coMat);
  co.position.copy(pos.clone().add(N.clone().multiplyScalar(0.04*sVar)));
  co.renderOrder = 9;
  globeGroup.add(co);
  explosionsV4.push({type:'v4_core', mesh:co, t:0, dur:1.6, sVar:sVar});

  // ── GROUND SPLASH — wide flat dust cloud (puff ring) ──
  var splashBuilt = buildV4PuffCluster(makeV4SplashArrangement(), {
    uTop:    new THREE.Vector3(0.85, 0.65, 0.50),
    uUnder:  new THREE.Vector3(0.55, 0.32, 0.22),
    uShadow: new THREE.Vector3(0.14, 0.08, 0.06),
    uAlphaMul: 0.95,
    uRimPow: 1.6,
    uUp: N.clone()
  });
  var sp = splashBuilt.group;
  sp.quaternion.copy(quatN);
  sp.position.copy(pos.clone().add(N.clone().multiplyScalar(splashRad*0.18)));
  sp.scale.set(splashRad, splashRad*0.32, splashRad);
  sp.renderOrder = 1;
  globeGroup.add(sp);
  explosionsV4.push({
    type:'v4_splash', mesh:sp, puffs:splashBuilt.puffs, isCluster:true,
    splashRad:splashRad,
    t:0, dur:yieldDuration*0.85,
    sVar:sVar, baseR:splashRad, N:N.clone(), basePos:pos.clone()
  });

  // ── STEM — thick column (puff cluster), rises from impact ──
  var stemBuilt = buildV4PuffCluster(makeV4StemArrangement(), {
    uTop:    new THREE.Vector3(0.92, 0.62, 0.42),
    uUnder:  new THREE.Vector3(0.55, 0.28, 0.18),
    uShadow: new THREE.Vector3(0.16, 0.08, 0.06),
    uAlphaMul: 0.95,
    uRimPow: 1.5,
    uUp: N.clone()
  });
  var st = stemBuilt.group;
  st.quaternion.copy(quatN);
  st.position.copy(pos.clone().add(N.clone().multiplyScalar(stemLen*0.5)));
  // Cluster is unit-height (-0.5..+0.5). Base scale: x/z = stemRadius*2, y = stemLen.
  // Start very short and thinner, grow into full size.
  st.scale.set(stemRadius*2*0.6, stemLen*0.08, stemRadius*2*0.6);
  st.renderOrder = 2;
  globeGroup.add(st);
  explosionsV4.push({
    type:'v4_stem', mesh:st, puffs:stemBuilt.puffs, isCluster:true,
    stemRadius:stemRadius, stemLen:stemLen,
    t:0, dur:yieldDuration,
    sVar:sVar, N:N.clone(), basePos:pos.clone()
  });

  // ── CAP — fluffy cauliflower mushroom head (puff cluster) ──
  var capBuilt = buildV4PuffCluster(makeV4CapArrangement(), {
    uTop:    new THREE.Vector3(0.96, 0.74, 0.62), // peach top
    uUnder:  new THREE.Vector3(0.55, 0.30, 0.22), // shadowed underside
    uShadow: new THREE.Vector3(0.18, 0.10, 0.08),
    uAlphaMul: 1.0,
    uRimPow: 1.4,
    uUp: N.clone()
  });
  var cp = capBuilt.group;
  cp.quaternion.copy(quatN);
  cp.position.copy(pos.clone().add(N.clone().multiplyScalar(capAltitude)));
  cp.scale.setScalar(capRadius * 0.25); // small at impact, will inflate
  cp.renderOrder = 3;
  globeGroup.add(cp);
  explosionsV4.push({
    type:'v4_cap', mesh:cp, puffs:capBuilt.puffs, isCluster:true,
    capRadius:capRadius,
    t:0, dur:yieldDuration,
    sVar:sVar, capAlt:capAltitude, N:N.clone(), basePos:pos.clone()
  });

  // ── EARTH CRUST EJECTA — chunks of ground lift from the impact ──
  spawnV4Ejecta(pos, N, sVar, yieldScale);

  // ── PERSISTENT CRATER DECAL — dark scorch left on the surface ──
  spawnCraterDecal(pos, N, sVar, yieldScale);

  // ── PERSISTENT BRIGHT CORE — visible glow under the cap throughout linger ──
  var bcGeo = new THREE.SphereGeometry(0.16*sVar, 32, 32);
  var bcMat = new THREE.MeshBasicMaterial({color:0xffaa44, transparent:true, opacity:0.85, depthWrite:false, blending:THREE.AdditiveBlending});
  var bc = new THREE.Mesh(bcGeo, bcMat);
  bc.position.copy(pos.clone().add(N.clone().multiplyScalar(0.05*sVar)));
  bc.renderOrder = 6;
  globeGroup.add(bc);
  explosionsV4.push({type:'v4_brightcore', mesh:bc, t:0, dur:yieldDuration*0.55, sVar:sVar, basePos:pos.clone(), N:N.clone()});

  // ── INNER WHITE-HOT NUCLEUS — small intense kernel inside the bright core ──
  var inGeo = new THREE.SphereGeometry(0.06*sVar, 24, 24);
  var inMat = new THREE.MeshBasicMaterial({color:0xffeec0, transparent:true, opacity:1.0, depthWrite:false, blending:THREE.AdditiveBlending});
  var inMesh = new THREE.Mesh(inGeo, inMat);
  inMesh.position.copy(pos.clone().add(N.clone().multiplyScalar(0.04*sVar)));
  inMesh.renderOrder = 7;
  globeGroup.add(inMesh);
  explosionsV4.push({type:'v4_nucleus', mesh:inMesh, t:0, dur:yieldDuration*0.40, sVar:sVar, basePos:pos.clone(), N:N.clone()});

  // ── GROUND FIRE — small additive flame plume right at the impact ──
  var fireGroup = new THREE.Group();
  var fireFlames = [];
  var fireGeo = getV4PuffGeometry();
  var nFlames = 7;
  for(var fi = 0; fi < nFlames; fi++){
    var ang = (fi / nFlames) * Math.PI * 2;
    var rad = 0.04 * sVar * (0.4 + Math.random() * 0.7);
    var col = (fi % 3 === 0) ? 0xffe6a0 : (fi % 3 === 1 ? 0xff9530 : 0xff5018);
    var fMat = new THREE.MeshBasicMaterial({
      color: col, transparent: true, opacity: 0.95,
      depthWrite: false, blending: THREE.AdditiveBlending
    });
    var fMesh = new THREE.Mesh(fireGeo, fMat);
    fMesh.position.set(Math.cos(ang) * rad, 0, Math.sin(ang) * rad);
    var bs = 0.10 * sVar * (0.7 + Math.random() * 0.6);
    fMesh.scale.setScalar(bs);
    fireGroup.add(fMesh);
    fireFlames.push({ mesh:fMesh, baseScale:bs, phase:Math.random()*Math.PI*2, lift:0.15 + Math.random()*0.35 });
  }
  fireGroup.quaternion.copy(quatN);
  fireGroup.position.copy(pos.clone().add(N.clone().multiplyScalar(0.02*sVar)));
  fireGroup.renderOrder = 8;
  globeGroup.add(fireGroup);
  explosionsV4.push({
    type:'v4_fire', mesh:fireGroup, flames:fireFlames, isFireCluster:true,
    sVar:sVar, t:0, dur:yieldDuration*0.55, basePos:pos.clone(), N:N.clone()
  });

  // ── WIDE LOW-ALTITUDE DUST RING — sparse puff ring hugging the ground ──
  var drBuilt = buildV4PuffCluster(makeV4DustRingArrangement(), {
    uTop:    new THREE.Vector3(0.65, 0.50, 0.38),
    uUnder:  new THREE.Vector3(0.40, 0.25, 0.18),
    uShadow: new THREE.Vector3(0.10, 0.06, 0.05),
    uAlphaMul: 0.78,
    uRimPow: 1.7,
    uUp: N.clone()
  });
  var dr = drBuilt.group;
  dr.quaternion.copy(quatN);
  dr.position.copy(pos.clone().add(N.clone().multiplyScalar(splashRad*0.10)));
  var drR = splashRad * 1.6;
  dr.scale.set(drR * 0.20, drR * 0.06, drR * 0.20);
  dr.renderOrder = 0;
  globeGroup.add(dr);
  explosionsV4.push({
    type:'v4_dustring', mesh:dr, puffs:drBuilt.puffs, isCluster:true,
    drR:drR,
    t:0, dur:yieldDuration*1.05,
    sVar:sVar, baseR:drR, N:N.clone(), basePos:pos.clone()
  });

  // ── SHOCKWAVE RINGS — additive bright bands sweeping across the surface ──
  for(var sw=0; sw<3; sw++){
    (function(idx){
      var inner = 0.005 + idx*0.004;
      var outer = inner + 0.006 + idx*0.003;
      var rGeo = new THREE.RingGeometry(inner, outer, 96);
      var col = idx===0 ? 0xffffff : (idx===1 ? 0xffd88a : 0xff7733);
      var rMat = new THREE.MeshBasicMaterial({
        color: col, transparent:true, opacity:0.9 - idx*0.20,
        side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending
      });
      var rMesh = new THREE.Mesh(rGeo, rMat);
      rMesh.position.copy(pos.clone().add(N.clone().multiplyScalar(0.0025)));
      rMesh.lookAt(rMesh.position.clone().add(N));
      rMesh.renderOrder = 5;
      globeGroup.add(rMesh);
      explosionsV4.push({
        type:'v4_shockring', mesh:rMesh, t:0, dur:1.2 + idx*0.4,
        sVar:sVar, idx:idx, spd:(1.4 - idx*0.30)*sVar
      });
    })(sw);
  }

  // ── EMBERS — points rising in updraft alongside the cloud ──
  var nEmb = Math.floor(80 + yieldScale*70);
  var ePos = new Float32Array(nEmb*3);
  var eData = [];
  for(var ei=0; ei<nEmb; ei++){
    ePos[ei*3]=pos.x; ePos[ei*3+1]=pos.y; ePos[ei*3+2]=pos.z;
    var T1e = new THREE.Vector3(1,0,0).cross(N).normalize();
    if(T1e.lengthSq() < 0.01) T1e = new THREE.Vector3(0,1,0).cross(N).normalize();
    var T2e = N.clone().cross(T1e).normalize();
    var aE = Math.random()*Math.PI*2;
    var rE = Math.random()*0.20*sVar;
    eData.push({
      offsetVec: T1e.clone().multiplyScalar(Math.cos(aE)*rE).add(T2e.clone().multiplyScalar(Math.sin(aE)*rE)),
      riseSpd: (0.04 + Math.random()*0.08) * (0.6 + yieldScale*0.4),
      spiralR: 0.005 + Math.random()*0.020,
      spiralPhase: Math.random()*Math.PI*2,
      spiralSpd: 0.6 + Math.random()*1.2,
      delay: Math.random()*0.6,
      life: 2.5 + Math.random()*2.5
    });
  }
  var eGeo = new THREE.BufferGeometry();
  eGeo.setAttribute('position', new THREE.BufferAttribute(ePos, 3));
  var emMat = new THREE.PointsMaterial({
    color:0xff8833, size:0.006*sVar, transparent:true, opacity:0.9,
    depthWrite:false, sizeAttenuation:true, blending:THREE.AdditiveBlending
  });
  var emPts = new THREE.Points(eGeo, emMat);
  emPts.renderOrder = 8;
  globeGroup.add(emPts);
  explosionsV4.push({
    type:'v4_embers', mesh:emPts, t:0, dur:5 + yieldScale*1.5,
    sVar:sVar, n:nEmb, data:eData,
    N:N.clone(), basePos:pos.clone()
  });

  // Globe shake
  var gOX=globeGroup.position.x, gOY=globeGroup.position.y, gOZ=globeGroup.position.z;
  var skT=0;
  var shakeAmp = 0.005 + yieldScale*0.008;
  var skI=setInterval(function(){
    skT+=0.025;
    if(skT>1.2){clearInterval(skI);globeGroup.position.set(gOX,gOY,gOZ);return;}
    var amp=skT<0.10? shakeAmp*(1-skT/0.10) : (shakeAmp*0.30)*Math.pow(1-skT*0.85,4);
    globeGroup.position.x=gOX+(Math.random()-0.5)*amp;
    globeGroup.position.y=gOY+(Math.random()-0.5)*amp;
    globeGroup.position.z=gOZ+(Math.random()-0.5)*amp*0.3;
  },16);
}

function updateExplosionsV4(dt){
  function kill(e){
    globeGroup.remove(e.mesh);
    if(e.isCluster && e.puffs){
      for(var ki = 0; ki < e.puffs.length; ki++){
        var km = e.puffs[ki].mesh.material;
        if(km) km.dispose();
      }
    } else if(e.isFireCluster && e.flames){
      for(var ki2 = 0; ki2 < e.flames.length; ki2++){
        var km2 = e.flames[ki2].mesh.material;
        if(km2) km2.dispose();
      }
    } else {
      if(e.mesh.geometry) e.mesh.geometry.dispose();
      if(e.mesh.material) e.mesh.material.dispose();
    }
    e.dead = true;
  }

  function easeOutCubic(x){ return 1 - Math.pow(1-x, 3); }
  function smoothstep(a, b, x){ var t = Math.max(0, Math.min(1, (x-a)/(b-a))); return t*t*(3-2*t); }

  explosionsV4.forEach(function(e){
    e.t += dt;
    var life = Math.min(1.0, e.t / e.dur);

    if(e.type === 'v4_flash'){
      var s = 1 + e.t*55;
      e.mesh.scale.set(s,s,s);
      e.mesh.material.opacity = Math.max(0, 1 - life);
      if(life >= 1) kill(e);
      return;
    }

    if(e.type === 'v4_core'){
      var s = 1 + e.t*8;
      e.mesh.scale.set(s,s,s);
      e.mesh.material.opacity = Math.max(0, 0.95 * (1 - life));
      if(life >= 1) kill(e);
      return;
    }

    if(e.type === 'v4_splash'){
      var spread = easeOutCubic(smoothstep(0, 0.45, life));
      var sxFrac = 0.30 + 1.20 * spread;
      var syFrac = 0.18 + 0.18 * spread;
      var R = e.splashRad || 1.0;
      e.mesh.scale.set(R * sxFrac, R * syFrac, R * sxFrac);
      if(life > 0.5 && e.puffs){
        var fadeAmt = 1 - smoothstep(0.5, 1.0, life);
        for(var pi = 0; pi < e.puffs.length; pi++){
          var pm = e.puffs[pi].mesh.material;
          if(pm && pm.uniforms && pm.uniforms.uAlphaMul) pm.uniforms.uAlphaMul.value = fadeAmt * 0.95;
        }
      }
      if(life >= 1) kill(e);
      return;
    }

    if(e.type === 'v4_stem'){
      var extend = easeOutCubic(smoothstep(0, 0.35, life));
      var fatten = smoothstep(0, 0.4, life);
      var sxFrac = 0.55 + 0.65 * fatten;
      var syFrac = 0.08 + 0.92 * extend;
      var baseXZ = e.stemRadius * 2;
      e.mesh.scale.set(baseXZ * sxFrac, e.stemLen * syFrac, baseXZ * sxFrac);
      var halfLen = e.stemLen * 0.5 * syFrac;
      e.mesh.position.copy(e.basePos.clone().add(e.N.clone().multiplyScalar(halfLen)));
      if(life > 0.7 && e.puffs){
        var fadeAmt = 1 - smoothstep(0.7, 1.0, life);
        for(var pi = 0; pi < e.puffs.length; pi++){
          var pm = e.puffs[pi].mesh.material;
          if(pm && pm.uniforms && pm.uniforms.uAlphaMul) pm.uniforms.uAlphaMul.value = fadeAmt * 0.95;
        }
      }
      if(life >= 1) kill(e);
      return;
    }

    if(e.type === 'v4_crust'){
      // Mode transition — structure ready for "flow into space" later
      if(e.mode === 'ballistic' && e.t >= e.escapeAt){
        e.mode = 'escape';
        e.gravStrength = 0;
      }

      // Acceleration toward (ballistic) or away from (escape) planet center
      var nrm = e.pos.clone().normalize();
      if(e.mode === 'ballistic'){
        e.vel.add(nrm.clone().multiplyScalar(-e.gravStrength * dt));
      } else {
        e.vel.add(nrm.clone().multiplyScalar(e.escapeOutward * dt));
      }

      // Integrate position + rotation
      e.pos.add(e.vel.clone().multiplyScalar(dt));
      e.mesh.position.copy(e.pos);
      e.mesh.rotation.x += e.angVel.x * dt;
      e.mesh.rotation.y += e.angVel.y * dt;
      e.mesh.rotation.z += e.angVel.z * dt;
      if(e.glowMesh) e.glowMesh.position.copy(e.pos);

      // Fade out in final fadeIn seconds
      var rem = e.dur - e.t;
      var op = rem < e.fadeIn ? Math.max(0, rem / e.fadeIn) : 1.0;
      e.mesh.material.opacity = op;
      if(e.glowMesh) e.glowMesh.material.opacity = 0.55 * op;

      // Death conditions: lifetime expired OR ballistic chunk hit the ground
      var hitGround = e.mode === 'ballistic' && e.pos.length() < globeRadius * 1.001;
      if(life >= 1 || hitGround){
        globeGroup.remove(e.mesh);
        // Earth-skin chunks have unique per-chunk geometry; primitive chunks
        // share a pooled geometry and only their material is per-chunk.
        if(!e.sharedGeo && e.mesh.geometry) e.mesh.geometry.dispose();
        if(e.mesh.material) e.mesh.material.dispose();
        if(e.glowMesh){
          globeGroup.remove(e.glowMesh);
          if(e.glowMesh.geometry) e.glowMesh.geometry.dispose();
          if(e.glowMesh.material) e.glowMesh.material.dispose();
        }
        e.dead = true;
      }
      return;
    }

    if(e.type === 'v4_cap'){
      // Cap inflates from small to full + drifts up slightly during linger
      var inflate = easeOutCubic(smoothstep(0.05, 0.45, life));
      var s = 0.25 + 1.05 * inflate;
      if(life > 0.45){
        var settle = smoothstep(0.45, 0.65, life);
        s = 1.30 - 0.18 * settle;
      }
      var sBase = e.capRadius || 1.0;
      e.mesh.scale.set(sBase * s, sBase * s * 0.85, sBase * s);
      var rise = easeOutCubic(smoothstep(0, 0.35, life));
      var drift = smoothstep(0.45, 1.0, life) * 0.25;
      var alt = e.capAlt * (0.30 + 0.70 * rise + drift);
      e.mesh.position.copy(e.basePos.clone().add(e.N.clone().multiplyScalar(alt)));
      // Fade the cluster as life ends
      if(life > 0.7 && e.puffs){
        var fadeAmt = 1 - smoothstep(0.7, 1.0, life);
        for(var pi = 0; pi < e.puffs.length; pi++){
          var pm = e.puffs[pi].mesh.material;
          if(pm && pm.uniforms && pm.uniforms.uAlphaMul) pm.uniforms.uAlphaMul.value = fadeAmt;
        }
      }
      if(life >= 1) kill(e);
      return;
    }

    if(e.type === 'v4_brightcore'){
      // Pulse and fade — visible glow under the cap during early stages
      var pulse = 1 + 0.4 * Math.sin(e.t * 14);
      var grow = 1 + e.t * 1.8;
      e.mesh.scale.setScalar(grow * pulse);
      e.mesh.material.opacity = Math.max(0, 0.85 * Math.pow(1 - life, 1.4));
      if(life >= 1) kill(e);
      return;
    }

    if(e.type === 'v4_nucleus'){
      // White-hot kernel — flares briefly then collapses
      var flare = e.t < 0.15 ? (1 + e.t * 18) : (1 + 0.15*18) * (1 - smoothstep(0.15, 0.5, e.t)*0.6);
      e.mesh.scale.setScalar(flare);
      e.mesh.material.opacity = Math.max(0, 1.0 * Math.pow(1 - life, 2.2));
      if(life >= 1) kill(e);
      return;
    }

    if(e.type === 'v4_fire'){
      // Each flame puff flickers, lifts a little, and fades. Cluster lives
      // entirely under the cap so it hugs the impact crater.
      var fade = 1 - smoothstep(0.55, 1.0, life);
      for(var fi2 = 0; fi2 < e.flames.length; fi2++){
        var f = e.flames[fi2];
        var flick = 0.85 + 0.30 * Math.sin(e.t * 18 + f.phase) + 0.10 * Math.sin(e.t * 47 + f.phase * 2);
        f.mesh.scale.setScalar(f.baseScale * flick);
        // Local lift along cluster's local up (cluster is oriented to surface normal)
        f.mesh.position.y = f.lift * e.sVar * smoothstep(0, 0.4, life) * (0.6 + 0.4 * flick);
        f.mesh.material.opacity = Math.max(0, 0.95 * fade * (0.7 + 0.3 * flick));
      }
      if(life >= 1) kill(e);
      return;
    }

    if(e.type === 'v4_dustring'){
      var spread = easeOutCubic(smoothstep(0, 0.55, life));
      var sxFrac = 0.20 + 1.30 * spread;
      var syFrac = 0.06 + 0.10 * smoothstep(0, 0.7, life);
      var R = e.drR || 1.0;
      e.mesh.scale.set(R * sxFrac, R * syFrac, R * sxFrac);
      if(life > 0.55 && e.puffs){
        var fadeAmt = 1 - smoothstep(0.55, 1.0, life);
        for(var pi = 0; pi < e.puffs.length; pi++){
          var pm = e.puffs[pi].mesh.material;
          if(pm && pm.uniforms && pm.uniforms.uAlphaMul) pm.uniforms.uAlphaMul.value = fadeAmt * 0.78;
        }
      }
      if(life >= 1) kill(e);
      return;
    }

    if(e.type === 'v4_shockring'){
      // Expanding ring on globe surface
      var grow = 1 + e.t * e.spd * 18;
      e.mesh.scale.set(grow, grow, 1);
      e.mesh.material.opacity = Math.max(0, (0.9 - e.idx*0.20) * (1 - life));
      if(life >= 1) kill(e);
      return;
    }

    if(e.type === 'v4_embers'){
      // Rising/spiraling embers
      var positions = e.mesh.geometry.attributes.position.array;
      // Tangent basis from N (stable per-explosion)
      var T1 = new THREE.Vector3(1,0,0).cross(e.N);
      if(T1.lengthSq() < 0.01) T1 = new THREE.Vector3(0,1,0).cross(e.N);
      T1.normalize();
      var T2 = e.N.clone().cross(T1).normalize();
      for(var i=0; i<e.n; i++){
        var d = e.data[i];
        var lt = Math.max(0, e.t - d.delay);
        var fr = Math.min(1, lt / d.life);
        var rise = lt * d.riseSpd * 8;
        var ang = d.spiralPhase + lt * d.spiralSpd;
        var sx = Math.cos(ang) * d.spiralR * (0.5 + fr*1.5);
        var sy = Math.sin(ang) * d.spiralR * (0.5 + fr*1.5);
        var p = e.basePos.clone()
          .add(d.offsetVec)
          .add(e.N.clone().multiplyScalar(rise))
          .add(T1.clone().multiplyScalar(sx))
          .add(T2.clone().multiplyScalar(sy));
        positions[i*3]   = p.x;
        positions[i*3+1] = p.y;
        positions[i*3+2] = p.z;
      }
      e.mesh.geometry.attributes.position.needsUpdate = true;
      e.mesh.material.opacity = Math.max(0, 0.9 * (1 - life));
      if(life >= 1) kill(e);
      return;
    }
  });

  explosionsV4 = explosionsV4.filter(function(e){ return !e.dead; });
}

function startGame(){
  var el = document.getElementById('splashEl');
  if(el) el.style.animation = 'fadeIn .3s reverse';
  setTimeout(function(){
    document.getElementById('splashOverlay').innerHTML = '';
    gamePhase = 'SELECT_NATION';
    showToast('Select your nation in the side panel →', 't-info');
    if(window.innerWidth <= 900){
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('mobileOverlay').classList.add('visible');
    }
  }, 280);
}

function showHelp(){ showSplash(); }

// ─── Toast Notifications ───
function showToast(msg, cls){
  var c = document.getElementById('toastContainer');
  if(!c) return;
  var t = document.createElement('div');
  t.className = 'toast ' + (cls || 't-info');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(function(){ t.classList.add('fading'); setTimeout(function(){ t.remove(); }, 220); }, 3200);
}

// ─── DEFCON ───
function setDefcon(level){
  level = Math.max(1, Math.min(5, level));
  if(level === defconLevel) return;
  defconLevel = level;
  var b = document.getElementById('defconBadge');
  if(!b) return;
  b.style.display = 'inline-flex';
  b.className = 'defcon-badge d' + level;
  document.getElementById('defconText').textContent = 'DEFCON ' + level;
  if(level <= 2) showToast('☢ DEFCON ' + level + ' — ' + DEFCON_LABELS[level], 't-danger');
  else if(level === 3) showToast('⚠ DEFCON 3 — Tension rising', 't-warn');
}

function recomputeDefcon(){
  // Drive DEFCON from active conflict state
  if(gamePhase === 'GAME_OVER') return;
  var totalEnemyWarheads = aiNations.reduce(function(s,n){ return s + n.warheads; }, 0);
  var anyDestroyed = destroyedNationIds.size > 0;
  var playerHurt = playerNation && playerNation.cities.some(function(c){ return c.pop <= 0; });
  var lvl = 5;
  if(turnNumber >= 1) lvl = 3;
  if(playerHurt || totalKills > 1e6) lvl = 2;
  if(anyDestroyed || totalKills > 5e6) lvl = 1;
  setDefcon(lvl);
}

// ─── Web Audio cues ───
var _audioCtx = null;
function audio(){ if(!_audioCtx){ try{ _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ _audioCtx = null; } } return _audioCtx; }
function playTone(freq, dur, type, vol){
  var ctx = audio(); if(!ctx) return;
  var o = ctx.createOscillator(); var g = ctx.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.value = 0; g.gain.linearRampToValueAtTime(vol || 0.08, ctx.currentTime + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime + dur + 0.05);
}
function sfxLaunch(){ playTone(180, 0.5, 'sawtooth', 0.07); setTimeout(function(){ playTone(120, 0.4, 'sawtooth', 0.05); }, 80); }
function sfxImpact(){ playTone(60, 0.7, 'triangle', 0.12); playTone(45, 0.9, 'sawtooth', 0.08); }
function sfxIntercept(){ playTone(900, 0.15, 'square', 0.06); }
function sfxClick(){ playTone(440, 0.06, 'sine', 0.05); }

// ─── Swipe-to-Close Sidebar (mobile) ───
(function(){
  var sidebar = document.getElementById('sidebar');
  var startX = 0, startY = 0, swiping = false;
  sidebar.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    swiping = true;
  }, {passive:true});
  sidebar.addEventListener('touchmove', function(e){
    if(!swiping) return;
    var dx = e.touches[0].clientX - startX;
    var dy = Math.abs(e.touches[0].clientY - startY);
    // Only track horizontal swipes (right)
    if(dx > 30 && dx > dy * 1.5){
      sidebar.style.transform = 'translateX(' + Math.max(0, dx - 30) + 'px)';
    }
  }, {passive:true});
  sidebar.addEventListener('touchend', function(e){
    if(!swiping) return;
    swiping = false;
    var endX = e.changedTouches[0].clientX;
    var dx = endX - startX;
    sidebar.style.transform = '';
    if(dx > 80){
      // Swipe right — close sidebar
      sidebar.classList.remove('open');
      document.getElementById('mobileOverlay').classList.remove('visible');
    }
  }, {passive:true});
})();
